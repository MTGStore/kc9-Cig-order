<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cigarette Order Analytics Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        .chart-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .chart-wrapper {
            position: relative;
            height: 300px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: white;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }
        
        .refresh-button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .refresh-button:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }
        
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .stat-value {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚬 Cigarette Order Analytics</h1>
            <p>Real-time ordering trends & insights</p>
        </div>
        
        <div id="loading" class="loading">Loading your order data...</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="dashboard" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Orders</div>
                    <div class="stat-value" id="totalOrders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Units</div>
                    <div class="stat-value" id="totalUnits">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Avg Units/Order</div>
                    <div class="stat-value" id="avgUnits">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Top Item</div>
                    <div class="stat-value" id="topItem" style="font-size: 1.1em; color: #333;">--</div>
                </div>
            </div>
            
            <div class="charts-grid">
                <div class="chart-container">
                    <div class="chart-title">Weekly Order Trend</div>
                    <div class="chart-wrapper">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">Total Units per Week</div>
                    <div class="chart-wrapper">
                        <canvas id="unitsChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">Top 10 Items Ordered</div>
                    <div class="chart-wrapper">
                        <canvas id="topItemsChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">Orders by Week</div>
                    <div class="chart-wrapper">
                        <canvas id="distributionChart"></canvas>
                    </div>
                </div>
            </div>
            
            <center>
                <button class="refresh-button" onclick="location.reload()">🔄 Refresh Dashboard</button>
            </center>
        </div>
    </div>

    <script>
        // CSV URL for Order Details sheet (gid=1734590286)
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2F0AirAwq5MJ5WKj1dL9TTUtm-OByP6XjCLtUNjTvziy7ih-22VwKuZId_Vx6TpUHvtahTvaxfYti/pub?gid=1734590286&single=true&output=csv';

        let trendChart, unitsChart, topItemsChart, distributionChart;

        async function loadAndAnalyzeData() {
            try {
                // Fetch CSV data
                const response = await fetch(CSV_URL);
                const csv = await response.text();
                
                // Parse CSV
                const lines = csv.split('\n');
                const headers = lines[0].split(',').map(h => h.trim());
                
                // Find column indices
                const dateIdx = headers.indexOf('Date');
                const weekIdx = headers.indexOf('Week');
                const itemNameIdx = headers.indexOf('Item Name');
                const qtyIdx = headers.indexOf('Qty');
                
                if (dateIdx === -1 || weekIdx === -1 || itemNameIdx === -1 || qtyIdx === -1) {
                    throw new Error('Required columns not found in CSV');
                }
                
                // Parse data
                const orders = [];
                const itemMap = {};
                const weekMap = {};
                
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    
                    const parts = lines[i].split(',');
                    if (parts.length < qtyIdx + 1) continue;
                    
                    const date = parts[dateIdx].trim();
                    const week = parts[weekIdx].trim();
                    const itemName = parts[itemNameIdx].trim();
                    const qty = parseFloat(parts[qtyIdx].trim());
                    
                    if (isNaN(qty) || qty === 0) continue;
                    
                    orders.push({ date, week, itemName, qty });
                    
                    // Track items
                    if (!itemMap[itemName]) {
                        itemMap[itemName] = 0;
                    }
                    itemMap[itemName] += qty;
                    
                    // Track weeks
                    if (!weekMap[week]) {
                        weekMap[week] = { count: 0, qty: 0 };
                    }
                    weekMap[week].count++;
                    weekMap[week].qty += qty;
                }
                
                // Calculate stats
                const totalOrders = Object.values(weekMap).reduce((sum, w) => sum + w.count, 0);
                const totalUnits = Object.values(weekMap).reduce((sum, w) => sum + w.qty, 0);
                const avgUnits = totalOrders > 0 ? (totalUnits / totalOrders).toFixed(1) : 0;
                
                const topItemEntry = Object.entries(itemMap).sort((a, b) => b[1] - a[1])[0];
                const topItemName = topItemEntry ? topItemEntry[0].substring(0, 30) : 'N/A';
                
                // Update stats
                document.getElementById('totalOrders').textContent = totalOrders;
                document.getElementById('totalUnits').textContent = totalUnits.toFixed(1);
                document.getElementById('avgUnits').textContent = avgUnits;
                document.getElementById('topItem').textContent = topItemName;
                
                // Prepare chart data
                const sortedWeeks = Object.keys(weekMap).sort((a, b) => parseInt(a) - parseInt(b));
                const weekCounts = sortedWeeks.map(w => weekMap[w].count);
                const weekQtys = sortedWeeks.map(w => weekMap[w].qty.toFixed(1));
                
                // Top 10 items
                const topItems = Object.entries(itemMap)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 10);
                const topItemNames = topItems.map(item => item[0].substring(0, 25));
                const topItemQtys = topItems.map(item => item[1].toFixed(1));
                
                // Create charts
                createCharts(sortedWeeks, weekCounts, weekQtys, topItemNames, topItemQtys);
                
                // Show dashboard
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error loading data: ' + error.message;
            }
        }
        
        function createCharts(weeks, counts, qtys, topItemNames, topItemQtys) {
            const chartColor = '#667eea';
            const bgColor = 'rgba(102, 126, 234, 0.1)';
            
            // Trend Chart
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: weeks,
                    datasets: [{
                        label: 'Orders per Week',
                        data: counts,
                        borderColor: chartColor,
                        backgroundColor: bgColor,
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 6,
                        pointBackgroundColor: chartColor,
                        pointBorderColor: 'white',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: '#666' } },
                        x: { ticks: { color: '#666' } }
                    }
                }
            });
            
            // Units Chart
            const unitsCtx = document.getElementById('unitsChart').getContext('2d');
            unitsChart = new Chart(unitsCtx, {
                type: 'bar',
                data: {
                    labels: weeks,
                    datasets: [{
                        label: 'Total Units',
                        data: qtys,
                        backgroundColor: chartColor,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: '#666' } },
                        x: { ticks: { color: '#666' } }
                    }
                }
            });
            
            // Top Items Chart
            const topCtx = document.getElementById('topItemsChart').getContext('2d');
            topItemsChart = new Chart(topCtx, {
                type: 'barH',
                type: 'bar',
                data: {
                    labels: topItemNames,
                    datasets: [{
                        label: 'Units Ordered',
                        data: topItemQtys,
                        backgroundColor: chartColor,
                        borderRadius: 8
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { beginAtZero: true, ticks: { color: '#666' } },
                        y: { ticks: { color: '#666' } }
                    }
                }
            });
            
            // Distribution Chart
            const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe', '#43e97b', '#fa709a', '#fee140', '#30cfd0', '#ff6b9d'];
            const distCtx = document.getElementById('distributionChart').getContext('2d');
            distributionChart = new Chart(distCtx, {
                type: 'doughnut',
                data: {
                    labels: weeks,
                    datasets: [{
                        data: counts,
                        backgroundColor: colors.slice(0, weeks.length),
                        borderWidth: 2,
                        borderColor: 'white'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#333', padding: 15 } } }
                }
            });
        }
        
        // Load data on page load
        window.addEventListener('load', loadAndAnalyzeData);
    </script>
</body>
</html>
