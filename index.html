<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC-9 Cigarette Order Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            padding: 50px;
            max-width: 800px;
            text-align: center;
        }
        h1 {
            color: #667eea;
            font-size: 42px;
            margin-bottom: 15px;
        }
        .subtitle {
            color: #999;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .tool-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .tool-card:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        .tool-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .tool-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .tool-desc {
            font-size: 13px;
            opacity: 0.8;
            line-height: 1.4;
        }
        .footer {
            color: #999;
            font-size: 12px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 30px;
        }
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 28px;
            }
            .tools-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚬 KC-9 Order System</h1>
        <p class="subtitle">Cigarette Inventory & Order Management</p>

        <div class="tools-grid">
            <a href="Smart-Order.html" class="tool-card">
                <div class="tool-icon">📦</div>
                <div class="tool-name">Smart Order</div>
                <div class="tool-desc">Order with recommended quantities</div>
            </a>

            <a href="analytics-dashboard.html" class="tool-card">
                <div class="tool-icon">📊</div>
                <div class="tool-name">Analytics</div>
                <div class="tool-desc">View ordering trends & charts</div>
            </a>

            <a href="smart-ordering-guide.html" class="tool-card">
                <div class="tool-icon">📖</div>
                <div class="tool-name">Order Guide</div>
                <div class="tool-desc">Items ordered last 4 weeks</div>
            </a>
        </div>

        <div class="footer">
            <p>Powered by GitHub Pages + Google Sheets</p>
        </div>
    </div>
</body>
</html>
