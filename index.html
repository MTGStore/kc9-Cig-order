<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cigarette Order Guide - KC Mart #09</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            padding: 10px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }
        
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 20px;
            padding: 20px;
        }
        
        .auth-screen h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .auth-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn-auth {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-employee {
            background: #4CAF50;
            color: white;
        }
        
        .btn-employee:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        
        .btn-manager {
            background: #2196F3;
            color: white;
        }
        
        .btn-manager:hover {
            background: #0b7dda;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }
        
        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .password-modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
        }
        
        .modal-content input:focus {
            outline: none;
            border-color: #2196F3;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .modal-buttons button {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            flex: 1;
        }
        
        .btn-submit {
            background: #2196F3;
            color: white;
        }
        
        .btn-submit:hover {
            background: #0b7dda;
        }
        
        .btn-cancel {
            background: #f44336;
            color: white;
        }
        
        .btn-cancel:hover {
            background: #da190b;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header h1 {
            color: #333;
            font-size: 1.8em;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            flex-wrap: wrap;
        }
        
        .btn-logout {
            padding: 10px 20px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-logout:hover {
            background: #da190b;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .action-buttons button {
            flex: 1;
            min-width: 150px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #4CAF50;
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #2196F3;
            color: white;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #0b7dda;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }
        
        .btn-secondary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .items-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .items-container {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.4em;
            }
        }
        
        .item-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
            transition: all 0.3s;
        }
        
        .item-card.has-order {
            border-color: #4CAF50;
            background: #f0f8f0;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.2);
        }
        
        .item-card:hover {
            border-color: #4CAF50;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.2);
        }
        
        .item-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .item-meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .item-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .input-group label {
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }
        
        .input-group input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #4CAF50;
            background: #f0f8f0;
        }
        
        .order-qty-display {
            padding: 8px;
            border: 2px solid #4CAF50;
            border-radius: 4px;
            background: #f0f8f0;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            color: #333;
        }
        
        .order-qty-display.zero-or-negative {
            background: #ffe0e0;
            border-color: #f44336;
            color: #c62828;
        }
        
        .order-summary {
            background: #f0f8f0;
            border-left: 4px solid #4CAF50;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .order-summary h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        
        .summary-item:last-child {
            border-bottom: none;
        }
        
        .summary-item strong {
            color: #4CAF50;
        }
        
        .success-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 2000;
            max-width: 90%;
            width: 400px;
        }
        
        .success-popup.active {
            display: block;
            animation: popupSlideIn 0.3s ease;
        }
        
        @keyframes popupSlideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        .success-popup h2 {
            color: #4CAF50;
            font-size: 1.8em;
            margin-bottom: 15px;
        }
        
        .success-popup .checkmark {
            font-size: 4em;
            color: #4CAF50;
            margin-bottom: 15px;
        }
        
        .success-popup p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #c62828;
        }
        
        .info-message {
            background: #e3f2fd;
            color: #1565c0;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #2196F3;
        }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-screen">
        <h1>🚬 Cigarette Order Guide</h1>
        <p style="color: #666; margin-bottom: 30px; font-size: 1.1em;">KC Mart #09</p>
        <div class="auth-buttons">
            <button class="btn-auth btn-employee" onclick="selectRole('employee')">👤 Employee</button>
            <button class="btn-auth btn-manager" onclick="selectRole('manager')">🔐 Manager</button>
        </div>
    </div>
    
    <div id="passwordModal" class="password-modal">
        <div class="modal-content">
            <h2>Manager Login</h2>
            <input type="password" id="passwordInput" placeholder="Enter password" />
            <div class="modal-buttons">
                <button class="btn-submit" onclick="submitPassword()">Submit</button>
                <button class="btn-cancel" onclick="cancelPassword()">Cancel</button>
            </div>
        </div>
    </div>
    
    <div id="mainApp" style="display: none;">
        <div class="container">
            <div class="header">
                <div>
                    <h1>🚬 Cigarette Order Guide</h1>
                    <p style="color: #666; font-size: 14px;">KC Mart #09</p>
                </div>
                <div class="user-info">
                    <span id="userRole" style="background: #e3f2fd; padding: 8px 12px; border-radius: 6px; font-weight: bold; color: #1565c0;"></span>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>
            
            <!-- ACTION BUTTONS AT TOP -->
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="sendWhatsApp('format1')">📱 Send Order (Simple)</button>
                <button class="btn btn-secondary" onclick="sendWhatsApp('format2')">📱 Send Order (Full)</button>
                <button class="btn btn-primary" id="logButton" onclick="logToSheets()">💾 Log to Sheet</button>
            </div>
            
            <div class="controls">
                <input 
                    type="text" 
                    id="searchBox" 
                    class="search-box" 
                    placeholder="Search by name, item #, or UPC..." 
                    onkeyup="filterItems()"
                >
                <button class="btn btn-secondary" onclick="resetForm()">🔄 Reset</button>
            </div>
            
            <div id="itemsContainer" class="items-container">
                <div class="info-message">📦 Loading cigarette list...</div>
            </div>
            
            <div id="orderSummary" class="order-summary" style="display: none;">
                <h3>📋 Order Summary</h3>
                <div id="summaryContent"></div>
            </div>
        </div>
    </div>
    
    <div id="successPopup" class="success-popup">
        <div class="checkmark">✅</div>
        <h2>Order Logged!</h2>
        <p id="successMessage">Your order has been saved to the sheet.</p>
        <p style="color: #999; font-size: 14px;">Closing in <span id="countdown">3</span> seconds...</p>
    </div>

    <script>
        const OWNER_PHONE = '14046689091';
        const SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2F0AirAwq5MJ5WKj1dL9TTUtm-OByP6XjCLtUNjTvziy7ih-22VwKuZId_Vx6TpUHvtahTvaxfYti/pub?gid=0&single=true&output=csv';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxP5W9BDfiXLvNAq5Uk99G4a0qe7WQ9UD2-Iz-ir-3sgOVVG_B155vCxwr-DpqGWhMzUA/exec';
        const MANAGER_PASSWORD = '977381';
        
        let allItems = [];
        let userRole = null;
        let filteredItems = [];
        let itemValues = {};
        
        async function initApp() {
            console.log('🚀 Initializing app...');
            try {
                await loadItems();
                console.log('✅ App initialized successfully');
            } catch (error) {
                console.error('❌ Error initializing app:', error);
            }
        }
        
        function selectRole(role) {
            console.log('👤 Role selected:', role);
            if (role === 'manager') {
                document.getElementById('passwordModal').classList.add('active');
                setTimeout(() => document.getElementById('passwordInput').focus(), 100);
            } else {
                userRole = 'employee';
                showMainApp();
            }
        }
        
        function submitPassword() {
            const password = document.getElementById('passwordInput').value;
            console.log('🔐 Password submitted');
            
            if (password === MANAGER_PASSWORD) {
                userRole = 'manager';
                document.getElementById('passwordModal').classList.remove('active');
                document.getElementById('passwordInput').value = '';
                showMainApp();
            } else {
                alert('❌ Incorrect password');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }
        
        function cancelPassword() {
            console.log('🚪 Password modal closed');
            document.getElementById('passwordModal').classList.remove('active');
            document.getElementById('passwordInput').value = '';
        }
        
        function showMainApp() {
            console.log('📱 Showing main app for role:', userRole);
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userRole').textContent = userRole === 'manager' ? '🔐 Manager' : '👤 Employee';
            initApp();
        }
        
        async function loadItems() {
            console.log('📥 Loading items from Google Sheets...');
            try {
                const response = await fetch(SHEETS_URL);
                const csv = await response.text();
                console.log('📊 CSV loaded, parsing...');
                
                allItems = [];
                const lines = csv.split('\n');
                console.log(`📝 Total lines: ${lines.length}`);
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    const parts = parseCSVLine(line);
                    
                    if (parts.length >= 2) {
                        const item = {
                            id: parts[1] ? parts[1].trim() : '',
                            name: parts[0] ? parts[0].trim() : '',
                            itemNumber: parts[1] ? parts[1].trim() : '',
                            upc: parts[2] ? parts[2].trim() : '',
                            mustHave: parseFloat(parts[3]) || 0
                        };
                        
                        if (item.name && item.itemNumber) {
                            allItems.push(item);
                            itemValues[item.id] = { onDisplay: 0, underCabinet: 0 };
                        }
                    }
                }
                
                console.log(`✅ Loaded ${allItems.length} items`);
                filteredItems = [...allItems];
                renderItems();
            } catch (error) {
                console.error('❌ Error loading items:', error);
                document.getElementById('itemsContainer').innerHTML = 
                    `<div class="error-message">❌ Error loading items: ${error.message}</div>`;
            }
        }
        
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let insideQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const nextChar = line[i + 1];
                
                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        current += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }
        
        function calculateOrderQty(itemId) {
            const item = allItems.find(i => i.id === itemId);
            if (!item) return 0;
            
            const values = itemValues[itemId] || { onDisplay: 0, underCabinet: 0 };
            return item.mustHave - values.onDisplay - values.underCabinet;
        }
        
        function updateItemValue(itemId, field, value) {
            if (!itemValues[itemId]) {
                itemValues[itemId] = { onDisplay: 0, underCabinet: 0 };
            }
            itemValues[itemId][field] = parseFloat(value) || 0;
            updateSummary();
            sortAndRenderItems();
        }
        
        function sortAndRenderItems() {
            // ONLY POSITIVE orders (> 0) at top - everything else at bottom
            const itemsWithPositiveOrders = filteredItems.filter(item => {
                const orderQty = calculateOrderQty(item.id);
                return orderQty > 0;
            });
            
            const itemsOther = filteredItems.filter(item => {
                const orderQty = calculateOrderQty(item.id);
                return orderQty <= 0;
            });
            
            const sortedItems = [...itemsWithPositiveOrders, ...itemsOther];
            renderItems(sortedItems);
        }
        
        function renderItems(itemsToRender = filteredItems) {
            console.log(`🎨 Rendering ${itemsToRender.length} items...`);
            const container = document.getElementById('itemsContainer');
            
            if (itemsToRender.length === 0) {
                container.innerHTML = '<div class="info-message">No items found</div>';
                return;
            }
            
            container.innerHTML = itemsToRender.map((item, idx) => {
                const orderQty = calculateOrderQty(item.id);
                const isPositive = orderQty > 0;
                const values = itemValues[item.id] || { onDisplay: 0, underCabinet: 0 };
                
                return `
                    <div class="item-card ${isPositive ? 'has-order' : ''}">
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        <div class="item-meta">
                            <div>📦 Item #: ${escapeHtml(item.itemNumber)}</div>
                            <div>🔢 UPC: ${escapeHtml(item.upc || 'N/A')}</div>
                            <div>⭐ Must Have: ${item.mustHave}</div>
                        </div>
                        <div class="item-inputs">
                            <div class="input-group">
                                <label>On Display</label>
                                <input type="number" min="0" step="0.1" value="${values.onDisplay}" data-id="${item.id}" data-field="onDisplay" onchange="updateItemValue('${item.id}', 'onDisplay', this.value)">
                            </div>
                            <div class="input-group">
                                <label>Under Cabinet</label>
                                <input type="number" min="0" step="0.1" value="${values.underCabinet}" data-id="${item.id}" data-field="underCabinet" onchange="updateItemValue('${item.id}', 'underCabinet', this.value)">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>📥 Order Qty (Auto)</label>
                            <div class="order-qty-display ${!isPositive ? 'zero-or-negative' : ''}">
                                ${orderQty}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            console.log(`✅ Rendered ${itemsToRender.length} items`);
        }
        
        function filterItems() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            console.log(`🔍 Filtering by: "${searchTerm}"`);
            
            if (!searchTerm) {
                filteredItems = [...allItems];
            } else {
                filteredItems = allItems.filter(item =>
                    item.name.toLowerCase().includes(searchTerm) ||
                    item.itemNumber.includes(searchTerm) ||
                    item.upc.toLowerCase().includes(searchTerm)
                );
            }
            
            sortAndRenderItems();
            updateSummary();
        }
        
        function updateSummary() {
            let orderedCount = 0;
            let totalQty = 0;
            
            allItems.forEach(item => {
                const orderQty = calculateOrderQty(item.id);
                if (orderQty > 0) {
                    orderedCount++;
                    totalQty += orderQty;
                }
            });
            
            if (orderedCount > 0) {
                document.getElementById('orderSummary').style.display = 'block';
                document.getElementById('summaryContent').innerHTML = `
                    <div class="summary-item">
                        <span>Items to Order:</span>
                        <strong>${orderedCount}</strong>
                    </div>
                    <div class="summary-item">
                        <span>Total Quantity:</span>
                        <strong>${totalQty.toFixed(1)}</strong>
                    </div>
                `;
            } else {
                document.getElementById('orderSummary').style.display = 'none';
            }
        }
        
        function getOrderedItems() {
            const ordered = [];
            allItems.forEach(item => {
                const orderQty = calculateOrderQty(item.id);
                if (orderQty > 0) {
                    ordered.push({
                        name: item.name,
                        itemNumber: item.itemNumber,
                        qty: orderQty
                    });
                }
            });
            return ordered;
        }
        
        function sendWhatsApp(format) {
            const ordered = getOrderedItems();
            if (ordered.length === 0) {
                alert('❌ No items with positive orders');
                return;
            }
            
            const today = new Date();
            const weekNum = getWeekNumber(today);
            const dateStr = today.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            let message = `🚬 CIGARETTE ORDER — Week ${weekNum}\n📅 ${dateStr}\n------------------------------\n`;
            
            if (format === 'format1') {
                ordered.forEach(item => {
                    message += `#${item.itemNumber}: ${item.qty}\n`;
                });
            } else {
                ordered.forEach(item => {
                    message += `${item.name}\n#${item.itemNumber} | Order: ${item.qty}\n`;
                });
            }
            
            message += `------------------------------\nTotal: ${ordered.length} items`;
            
            const whatsappURL = `https://wa.me/${OWNER_PHONE}?text=${encodeURIComponent(message)}`;
            window.open(whatsappURL, '_blank');
            
            console.log('📱 WhatsApp message sent');
        }
        
        async function logToSheets() {
            const button = document.getElementById('logButton');
            const ordered = getOrderedItems();
            
            if (ordered.length === 0) {
                alert('❌ No items with positive orders');
                return;
            }
            
            console.log('💾 Logging order to sheets via Apps Script...');
            button.disabled = true;
            button.innerHTML = '<div class="loading"></div> Saving...';
            
            try {
                const today = new Date();
                const weekNum = getWeekNumber(today);
                const dateStr = today.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
                
                const ordersText = ordered.map(item => 
                    `${item.name} (#${item.itemNumber}): ${item.qty}`
                ).join(' | ');
                
                const formData = new FormData();
                formData.append('date', dateStr);
                formData.append('week', weekNum);
                formData.append('items', ordersText);
                
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.text();
                console.log('✅ Apps Script response:', result);
                
                showSuccessPopup();
                
                setTimeout(() => {
                    resetForm();
                    button.disabled = false;
                    button.innerHTML = '💾 Log to Sheet';
                }, 2000);
                
            } catch (error) {
                console.error('❌ Error logging order:', error);
                alert('❌ Error logging order: ' + error.message);
                button.disabled = false;
                button.innerHTML = '💾 Log to Sheet';
            }
        }
        
        function showSuccessPopup() {
            console.log('🎉 Showing success popup');
            const popup = document.getElementById('successPopup');
            const itemCount = getOrderedItems().length;
            document.getElementById('successMessage').textContent = `✅ ${itemCount} items saved to sheet`;
            popup.classList.add('active');
            
            let countdown = 3;
            const countdownEl = document.getElementById('countdown');
            
            const interval = setInterval(() => {
                countdown--;
                countdownEl.textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(interval);
                    popup.classList.remove('active');
                }
            }, 1000);
        }
        
        function resetForm() {
            console.log('🔄 Resetting form');
            itemValues = {};
            allItems.forEach(item => {
                itemValues[item.id] = { onDisplay: 0, underCabinet: 0 };
            });
            document.getElementById('searchBox').value = '';
            filteredItems = [...allItems];
            sortAndRenderItems();
            updateSummary();
        }
        
        function logout() {
            console.log('🚪 Logging out');
            userRole = null;
            allItems = [];
            filteredItems = [];
            itemValues = {};
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('passwordInput').value = '';
        }
        
        function getWeekNumber(date) {
            const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('passwordInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitPassword();
            });
        });
    </script>
</body>
