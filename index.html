<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cigarette Order Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');
  :root{--bg:#f5f4f0;--surface:#fff;--border:#e2e0d8;--border-strong:#c8c5ba;--text:#1a1916;--text-muted:#7a7870;--accent:#c8440a;--accent-bg:#fdf1ec;--accent-border:#f0c4b0;--success:#2a7a4b;--success-bg:#edf7f1;--success-border:#b0dcc0;--wa:#25d366;--wa-dark:#1aad52;--info:#1a6bb5;--info-bg:#e8f1fb;--info-border:#b0cef0;--radius:10px;--radius-sm:6px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;}
  .auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a1916 0%,#2a2a26 100%);z-index:1000;position:fixed;inset:0;}
  .auth-screen.hidden{display:none;}
  .auth-box{background:var(--surface);border-radius:var(--radius);padding:40px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .auth-title{font-size:24px;font-weight:600;margin-bottom:10px;text-align:center;color:var(--text);}
  .auth-subtitle{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:30px;}
  .auth-field{margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
  .auth-field label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);}
  .auth-field input{font-family:'DM Sans',sans-serif;font-size:14px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px;background:var(--bg);color:var(--text);outline:none;}
  .auth-field input:focus{border-color:var(--text);}
  .auth-buttons{display:flex;gap:8px;margin-top:24px;}
  .auth-buttons button{flex:1;padding:11px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;border:none;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;}
  .auth-btn-employee{background:var(--info-bg);color:var(--info);}
  .auth-btn-employee:hover{background:#d4e5f7;}
  .auth-btn-manager{background:var(--accent-bg);color:var(--accent);}
  .auth-btn-manager:hover{background:#fce5d9;}
  .auth-error{color:#c33;font-size:12px;margin-top:12px;text-align:center;display:none;}
  header{background:var(--text);color:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .header-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .title{font-size:16px;font-weight:600;}
  .access-badge{font-size:10px;font-weight:600;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2);color:#fff;}
  .access-badge.manager{background:#ffa500;}
  .sub{font-size:12px;color:#9a9890;margin-top:1px;}
  .header-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .header-btns .full{grid-column:1/-1;}
  .stats-bar{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border);background:var(--surface);}
  .stat{padding:12px 8px;border-right:1px solid var(--border);text-align:center;}
  .stat:last-child{border-right:none;}
  .stat-val{font-size:20px;font-weight:600;font-family:'DM Mono',monospace;}
  .stat-val.red{color:var(--accent);}
  .stat-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;}
  .toolbar{padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:10;}
  .search-wrap{flex:1;position:relative;}
  .search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;}
  input[type="search"]{font-family:'DM Sans',sans-serif;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);padding:8px 10px 8px 30px;outline:none;width:100%;}
  input[type="search"]:focus,input[type="number"]:focus,input[type="text"]:focus{border-color:var(--text);}
  input[type="number"],input[type="text"]{font-family:'DM Sans',sans-serif;font-size:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);padding:8px 10px;outline:none;}
  .btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:background .12s;}
  .btn:hover{background:var(--bg);}
  .btn.danger{background:#fff5f5;border-color:#f0b0b0;color:#a32d2d;}
  .btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;font-weight:600;}
  .btn.wa:hover{background:var(--wa-dark);}
  .btn.success{background:var(--success);border-color:var(--success);color:#fff;font-weight:600;}
  .btn.success:hover{background:#1f5a38;}
  .btn.info{background:var(--info-bg);border-color:var(--info-border);color:var(--info);font-weight:600;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,8,.55);z-index:100;align-items:flex-end;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:560px;overflow:hidden;box-shadow:0 -8px 40px rgba(0,0,0,.2);max-height:90vh;display:flex;flex-direction:column;}
  .modal-header{background:var(--text);color:#fff;padding:14px 18px;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
  .modal-close{background:none;border:none;color:#888;font-size:22px;cursor:pointer;line-height:1;}
  .modal-close:hover{color:#fff;}
  .modal-body{padding:16px;overflow-y:auto;}
  .no-order-msg{background:var(--success-bg);border:1px solid var(--success-border);border-radius:var(--radius-sm);padding:20px;color:var(--success);font-weight:500;text-align:center;font-size:14px;}
  .success-msg{background:#e6f9f0;border:1px solid #66d9ba;border-radius:var(--radius-sm);padding:12px;color:#0f6944;font-weight:500;text-align:center;font-size:13px;margin-bottom:12px;line-height:1.6;}
  .error-msg{background:#ffe6e6;border:1px solid #ff9999;border-radius:var(--radius-sm);padding:12px;color:#c33;font-weight:500;text-align:center;font-size:13px;margin-bottom:12px;}
  @media(min-width:700px){header{flex-direction:row;align-items:center;}.header-btns{grid-template-columns:repeat(5,auto);gap:8px;}.table-wrap{display:block;}.modal-overlay{align-items:center;}.modal{border-radius:var(--radius);}}
  @media(max-width:699px){.table-wrap{display:none;}}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{background:#f0ede6;padding:9px 10px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:hover td{background:#fafaf7;}
  tbody tr.ok-row td{opacity:.35;}
  td{padding:8px 10px;vertical-align:middle;background:var(--surface);}
  .item-name-td{font-weight:500;font-size:13px;}
  .item-meta-td{font-size:11px;color:var(--text-muted);font-family:'DM Mono',monospace;margin-top:1px;}
  td input[type="number"]{width:68px;text-align:center;padding:4px 5px;font-family:'DM Mono',monospace;font-size:13px;background:var(--surface);}
  .order-val-td{font-family:'DM Mono',monospace;font-size:14px;font-weight:600;text-align:center;}
  .order-val-td.need{color:var(--accent);}
  .order-val-td.ok{color:var(--success);}
  .dt-divider td{background:#f0ede6 !important;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);padding:5px 10px;}
  .dt-empty td{text-align:center;padding:36px;color:var(--text-muted);font-size:13px;background:var(--surface) !important;}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;}
  .badge.need{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border);}
  .badge.ok{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
</style>
</head>
<body>

<div class="auth-screen" id="auth-screen">
  <div class="auth-box">
    <div class="auth-title">Cigarette Order Guide</div>
    <div class="auth-subtitle">Select your access level</div>
    <div class="auth-field" id="manager-password-field" style="display:none;">
      <label>Manager Password</label>
      <input type="password" id="manager-password" placeholder="Enter password"/>
    </div>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-buttons">
      <button class="auth-btn-employee" onclick="loginEmployee()">👤 Employee</button>
      <button class="auth-btn-manager" onclick="promptManagerPassword()">🔐 Manager</button>
    </div>
  </div>
</div>

<header>
  <div class="header-top">
    <div>
      <div class="title">Cigarette Order Guide</div>
      <div class="sub">Scan UPC or enter counts manually</div>
    </div>
    <div class="access-badge" id="access-badge" style="display:none;">Employee</div>
  </div>
  <div class="header-btns" id="header-btns">
    <button class="btn danger" onclick="confirmClear()">&#8635; Clear</button>
    <button class="btn wa" onclick="openModal('send')">Send Order</button>
    <button class="btn success" onclick="openModal('log')">💾 Log to Sheet</button>
  </div>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-val" id="stat-total">0</div><div class="stat-label">Total</div></div>
  <div class="stat"><div class="stat-val red" id="stat-need">0</div><div class="stat-label">To Order</div></div>
  <div class="stat"><div class="stat-val" id="stat-ok">0</div><div class="stat-label">At Par</div></div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="search" placeholder="Search name, item #, UPC..." oninput="render()"/>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:35%">Item</th>
        <th style="width:15%;text-align:center">On Display</th>
        <th style="width:15%;text-align:center">Under Cabinets</th>
        <th style="width:10%;text-align:center">Must Have</th>
        <th style="width:10%;text-align:center">Combined</th>
        <th style="width:15%;text-align:center">Order Qty</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span id="modal-title">Modal</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const OWNER_PHONE='14046689091';
const SHEETS_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vR2F0AirAwq5MJ5WKj1dL9TTUtm-OByP6XjCLtUNjTvziy7ih-22VwKuZId_Vx6TpUHvtahTvaxfYti/pub?gid=0&single=true&output=csv';
const GOOGLE_FORM_URL='https://docs.google.com/forms/u/0/d/e/1FAIpQLScg0J0I5WqGYvE-3mhdbdpspzhFyUFDRsKA37sBTOVeYlBOAA/formResponse';
const FORM_ENTRY_DATE='entry.383999485';
const FORM_ENTRY_WEEK='entry.1221290365';
const FORM_ENTRY_ITEMS='entry.328677578';
const MANAGER_PASSWORD='977381';

let nextId=0;let state=[];let isManager=false;function loginEmployee(){isManager=false;showApp();}function promptManagerPassword(){document.getElementById('manager-password-field').style.display='flex';document.getElementById('manager-password').focus();}function loginManager(){const pw=document.getElementById('manager-password').value;const err=document.getElementById('auth-error');if(pw===MANAGER_PASSWORD){isManager=true;err.style.display='none';showApp();}else{err.textContent='Incorrect password';err.style.display='block';}}document.getElementById('manager-password')?.addEventListener('keypress',function(e){if(e.key==='Enter')loginManager();});function showApp(){document.getElementById('auth-screen').classList.add('hidden');document.getElementById('access-badge').style.display='inline-block';document.getElementById('access-badge').textContent=isManager?'🔐 Manager':'👤 Employee';document.getElementById('access-badge').classList.toggle('manager',isManager);loadItemsFromSheets();}function logoutManager(){isManager=false;document.getElementById('auth-screen').classList.remove('hidden');document.getElementById('manager-password-field').style.display='none';document.getElementById('manager-password').value='';document.getElementById('auth-error').style.display='none';}async function loadItemsFromSheets(){try{const response=await fetch(SHEETS_URL);if(!response.ok)throw new Error(`HTTP ${response.status}`);const csvText=await response.text();const lines=csvText.split('\n').filter(line=>line.trim());if(lines.length<2)throw new Error('Sheet is empty or invalid');const headers=lines[0].split(',').map(h=>h.trim().toLowerCase());const nameIdx=headers.findIndex(h=>h.includes('item name'));const numIdx=headers.findIndex(h=>h.includes('item number'));const upcIdx=headers.findIndex(h=>h.includes('upc'));const mustIdx=headers.findIndex(h=>h.includes('must have'));if(nameIdx===-1)throw new Error('Could not find "Item Name" column');state=[];for(let i=1;i<lines.length;i++){const cells=lines[i].split(',').map(c=>c.trim());const name=cells[nameIdx]||'';if(!name)continue;state.push({id:state.length,item_name:name,item_number:numIdx>=0?cells[numIdx]||'':'',upc:upcIdx>=0?cells[upcIdx]||'':'',must_have:mustIdx>=0?parseFloat(cells[mustIdx])||0:0,loc1:0,loc2:0});}nextId=state.length;render();console.log(`✅ Loaded ${state.length} items`);}catch(error){console.error('Error:',error);}}function calc(item){const combined=(parseFloat(item.loc1)||0)+(parseFloat(item.loc2)||0);const need=parseFloat(item.must_have)||0;const order=Math.max(0,+(need-combined).toFixed(2));return{combined:+combined.toFixed(2),order};}function render(){const q=document.getElementById('search').value.trim().toLowerCase();let filtered=state.filter(i=>!q||i.item_name.toLowerCase().includes(q)||i.item_number.toLowerCase().includes(q)||(i.upc&&i.upc.toLowerCase().includes(q)));const needItems=filtered.filter(i=>calc(i).order>0);const okItems=filtered.filter(i=>calc(i).order===0);const tbody=document.getElementById('table-body');tbody.innerHTML='';function addRow(item){const{combined,order}=calc(item);const tr=document.createElement('tr');if(order===0)tr.classList.add('ok-row');tr.innerHTML=`<td><div class="item-name-td">${item.item_name}</div><div class="item-meta-td">${item.item_number?'#'+item.item_number:'—'}${item.upc?' UPC:'+item.upc:''}</div></td><td style="text-align:center"><input type="number" min="0" step="0.5" value="${item.loc1}" onchange="upd(${item.id},'loc1',this.value)"/></td><td style="text-align:center"><input type="number" min="0" step="0.5" value="${item.loc2}" onchange="upd(${item.id},'loc2',this.value)"/></td><td style="text-align:center;font-family:'DM Mono',monospace;font-weight:500">${item.must_have}</td><td style="text-align:center;font-family:'DM Mono',monospace;font-weight:500">${combined}</td><td><div class="order-val-td ${order>0?'need':'ok'}">${order>0?order:'—'}</div></td>`;tbody.appendChild(tr);}needItems.forEach(addRow);if(needItems.length>0&&okItems.length>0){const d=document.createElement('tr');d.classList.add('dt-divider');d.innerHTML='<td colspan="6">Items at par</td>';tbody.appendChild(d);}okItems.forEach(addRow);if(filtered.length===0){const t=document.createElement('tr');t.classList.add('dt-empty');t.innerHTML='<td colspan="6">No items match</td>';tbody.appendChild(t);}document.getElementById('stat-total').textContent=state.length;document.getElementById('stat-need').textContent=state.filter(i=>calc(i).order>0).length;document.getElementById('stat-ok').textContent=state.filter(i=>calc(i).order===0).length;}function upd(id,field,value){const item=state.find(i=>i.id===id);if(item){item[field]=parseFloat(value)||0;render();}}function confirmClear(){if(confirm('Clear all counts?')){state.forEach(i=>{i.loc1=0;i.loc2=0;});render();}}function getWeekNumber(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-yearStart)/86400000)+1)/7);}async function logToSheets(){const orderItems=state.filter(i=>calc(i).order>0);if(orderItems.length===0){document.getElementById('modal-body').innerHTML='<div class="error-msg">❌ No items to order!</div><button class="btn" onclick="closeModal()" style="width:100%;padding:12px;margin-top:8px">Close</button>';return;}const today=new Date().toISOString().split('T')[0];const weekNum=getWeekNumber(new Date());const ordersText=orderItems.map(i=>`${i.item_name} (#${i.item_number||'N/A'}): ${calc(i).order}`).join(' | ');try{const formData=new FormData();formData.append(FORM_ENTRY_DATE,today);formData.append(FORM_ENTRY_WEEK,weekNum);formData.append(FORM_ENTRY_ITEMS,ordersText);await fetch(GOOGLE_FORM_URL,{method:'POST',mode:'no-cors',body:formData});setTimeout(()=>{document.getElementById('modal-body').innerHTML='<div class="success-msg">✅ Order logged to Google Sheets!<br><br>Date: '+today+'<br>Week: '+weekNum+'<br>Items ordered: '+orderItems.length+'<br><br>Refresh your Google Sheet to see the new entry.</div><button class="btn" onclick="closeModal()" style="width:100%;padding:12px;margin-top:8px">Done</button>';},500);}catch(error){document.getElementById('modal-body').innerHTML='<div class="error-msg">❌ Error logging order: '+error.message+'</div><button class="btn" onclick="closeModal()" style="width:100%;padding:12px;margin-top:8px">Close</button>';}}function openModal(type){document.getElementById('modal').classList.add('open');const title=document.getElementById('modal-title');const mb=document.getElementById('modal-body');if(type==='send'){title.textContent='Send Order';const orderItems=state.filter(i=>calc(i).order>0);const today=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});const weekNum=getWeekNumber(new Date());if(orderItems.length===0){mb.innerHTML='<div class="no-order-msg">Everything is fully stocked!</div>';return;}let waMsg1=`🚬 CIGARETTE ORDER — Week ${weekNum}\n📅 ${today}\n${'-'.repeat(30)}\n`;orderItems.forEach(i=>{const{order}=calc(i);waMsg1+=`${i.item_number?'#'+i.item_number:'N/A'}: ${order}\n`;});waMsg1+=`${'-'.repeat(30)}\nTotal: ${orderItems.length} items`;let waMsg2=`🚬 CIGARETTE ORDER — Week ${weekNum}\n📅 ${today}\n${'-'.repeat(30)}\n`;orderItems.forEach(i=>{const{order}=calc(i);waMsg2+=`${i.item_name}\n#${i.item_number||'N/A'} | Min: ${i.must_have} | Order: ${order}\n\n`;});waMsg2+=`${'-'.repeat(30)}\nTotal: ${orderItems.length} items`;const waURL1=`https://wa.me/${OWNER_PHONE}?text=${encodeURIComponent(waMsg1)}`;const waURL2=`https://wa.me/${OWNER_PHONE}?text=${encodeURIComponent(waMsg2)}`;mb.innerHTML=`<p style="font-size:12px;color:#666;margin-bottom:12px;text-align:center">📱 Choose WhatsApp format:</p><a href="${waURL1}" target="_blank" style="display:block;margin-bottom:8px"><button class="btn wa" style="width:100%;padding:12px">Format 1: Item # + Qty</button></a><a href="${waURL2}" target="_blank" style="display:block;margin-bottom:8px"><button class="btn wa" style="width:100%;padding:12px">Format 2: Full Details</button></a><button class="btn" onclick="closeModal()" style="width:100%;padding:12px">Cancel</button>`;}else if(type==='log'){title.textContent='Log Order to Sheet';const orderItems=state.filter(i=>calc(i).order>0);if(orderItems.length===0){mb.innerHTML='<div class="no-order-msg">No items to order — nothing to log!</div><button class="btn" onclick="closeModal()" style="width:100%;padding:12px">Close</button>';return;}mb.innerHTML=`<p style="font-size:13px;color:#666;margin-bottom:14px">Ready to save this order to Google Sheets?</p><div style="background:#f0ede6;padding:10px;border-radius:6px;margin-bottom:14px;font-size:12px"><strong>Summary:</strong><br>Items to order: ${orderItems.length}<br>Total quantity: ${orderItems.reduce((sum,i)=>sum+calc(i).order,0)}</div><button class="btn success" onclick="logToSheets()" style="width:100%;padding:12px;margin-bottom:8px">✅ Log to Google Sheet</button><button class="btn" onclick="closeModal()" style="width:100%;padding:12px">Cancel</button>`;}else if(type==='log-success'){title.textContent='✅ Logged!';mb.innerHTML='<div class="success-msg">Your order has been logged to Google Sheets!</div><button class="btn" onclick="closeModal()" style="width:100%;padding:12px">Close</button>';}}function closeModal(){document.getElementById('modal').classList.remove('open');}document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});render();
</script>
</body>
</html>
