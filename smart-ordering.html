<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Ordering - KC9</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .content {
            padding: 24px;
        }
        
        .upload-section {
            background: #f8f9fa;
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
        }
        
        .upload-section.active {
            background: #f0f9ff;
            border-color: #0ea5e9;
        }
        
        .upload-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }
        
        .upload-text {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 12px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn-upload {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .btn-upload:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 12px;
            color: #6b7280;
            font-size: 14px;
        }
        
        .results-section {
            display: none;
        }
        
        .results-section.show {
            display: block;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .results-header h2 {
            font-size: 20px;
            color: #1f2937;
        }
        
        .summary-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: #f3f4f6;
            padding: 12px 16px;
            border-radius: 6px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            margin-top: 4px;
        }
        
        .brand-group {
            margin-bottom: 24px;
        }
        
        .brand-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .brand-items {
            display: grid;
            gap: 8px;
        }
        
        .item-row {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 12px;
            display: grid;
            grid-template-columns: 1.5fr 0.8fr 0.8fr 0.8fr 0.8fr 0.6fr;
            gap: 12px;
            align-items: center;
            font-size: 13px;
        }
        
        @media (max-width: 900px) {
            .item-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            
            .item-row > div {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .item-row > div::before {
                content: attr(data-label);
                font-weight: 600;
                font-size: 11px;
                color: #6b7280;
                text-transform: uppercase;
            }
        }
        
        .item-name {
            font-weight: 500;
            color: #1f2937;
        }
        
        .item-number {
            color: #6b7280;
            font-family: monospace;
            font-size: 12px;
        }
        
        .value {
            text-align: center;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
        }
        
        .order-qty {
            background: #dcfce7;
            border-color: #86efac;
            font-weight: 600;
            color: #166534;
        }
        
        .flag-normal {
            background: white;
        }
        
        .flag-anomaly {
            background: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
            font-weight: 600;
        }
        
        .flag-icon {
            font-size: 16px;
            text-align: center;
        }
        
        .export-section {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        
        .btn-export {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            flex: 1;
            min-width: 150px;
        }
        
        .btn-whatsapp {
            background: #25d366;
            color: white;
        }
        
        .btn-whatsapp:hover {
            background: #20ba5a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
        }
        
        .btn-csv {
            background: #10b981;
            color: white;
        }
        
        .btn-csv:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Smart Ordering</h1>
            <p>Upload sales report • Auto-calculate order recommendations</p>
        </div>
        
        <div class="content">
            <div class="error-message" id="errorMsg"></div>
            
            <div class="upload-section" id="uploadSection">
                <div class="upload-icon">📄</div>
                <div class="upload-text">Drop PDF sales report or click to select</div>
                <input type="file" id="pdfInput" accept=".pdf" />
                <button class="btn-upload" onclick="document.getElementById('pdfInput').click()">
                    Choose PDF File
                </button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div class="loading-text">Processing PDF and calculating orders...</div>
            </div>
            
            <div class="results-section" id="resultsSection">
                <div class="results-header">
                    <h2>📊 Order Recommendations</h2>
                    <div class="summary-stats">
                        <div class="stat">
                            <div class="stat-value" id="totalItems">0</div>
                            <div class="stat-label">Items</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="totalOrder">0</div>
                            <div class="stat-label">Total Order</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="anomalies">0</div>
                            <div class="stat-label">Anomalies</div>
                        </div>
                    </div>
                </div>
                
                <div id="ordersContainer"></div>
                
                <div class="export-section">
                    <button class="btn-export btn-whatsapp" onclick="exportWhatsApp()">
                        📱 WhatsApp Report
                    </button>
                    <button class="btn-export btn-csv" onclick="exportCSV()">
                        📥 Download CSV
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let mainCigList = [];
        let currentOrders = {};
        
        // Hardcoded Main CIG LIST data as fallback (will be replaced when data loads)
        const HARDCODED_DATA = {
            '02820000384': { name: 'Marlboro Gold Short', number: '4336442', mustHave: 10 },
            '02610000575': { name: 'Newport Short', number: '4340618', mustHave: 8 },
            '02610000578': { name: 'Newport King Soft', number: '4340634', mustHave: 6 },
            '02720020589': { name: 'Pall Mall Select Blue Short', number: '4342023', mustHave: 5 },
            '02820000954': { name: 'Marlboro Black/GREEN short', number: '4357141', mustHave: 4 },
            '68514191015': { name: '24x7 Green 100s', number: '4973467', mustHave: 3 },
            '02820000477': { name: 'Marlboro silver short mellow', number: '4336452', mustHave: 7 },
            '02820031772': { name: 'Marlboro nxt', number: '4359212', mustHave: 5 },
            '01230000003': { name: 'Camel filter shorts', number: '4165932', mustHave: 4 },
            '02820000952': { name: 'Marlboro black/ Red short', number: '4357131', mustHave: 5 }
        };
        
        function extractTextFromPDF(pdfFile) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const pdfData = new Uint8Array(e.target.result);
                        const pdf = await pdfjsLib.getDocument({data: pdfData}).promise;
                        
                        let fullText = '';
                        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                            const page = await pdf.getPage(pageNum);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(' ');
                            fullText += pageText + '\n';
                        }
                        
                        resolve(fullText);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.readAsArrayBuffer(pdfFile);
            });
        }
        
        function parseSalesData(text) {
            const salesMap = {};
            const lines = text.split('\n');
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Match 11-12 digit scan codes
                if (/^\d{11,12}/.test(line)) {
                    const scanCode = line.match(/^(\d{11,12})/)[1];
                    
                    // Look for # Sold (should be after $Sold)
                    for (let j = i + 1; j < Math.min(i + 20, lines.length); j++) {
                        const potentialLine = lines[j].trim();
                        
                        // Skip lines with $ or %
                        if (potentialLine.includes('$') || potentialLine.includes('%') || potentialLine.includes('null')) continue;
                        
                        // Match single number
                        if (/^\d+$/.test(potentialLine)) {
                            const sold = parseInt(potentialLine);
                            if (sold > 0 && sold < 1000) {
                                salesMap[scanCode] = {
                                    upc: scanCode,
                                    sold: sold / 10
                                };
                                i = j;
                                break;
                            }
                        }
                    }
                }
            }
            
            return Object.values(salesMap);
        }
        
        function matchSalesToInventory(sales) {
            const results = {};
            let anomalies = 0;
            
            sales.forEach(item => {
                const cigItem = HARDCODED_DATA[item.upc];
                
                if (cigItem) {
                    // Calculate: Must Have - Sales = Order Qty
                    const orderQty = Math.max(0, cigItem.mustHave - item.sold);
                    
                    // Get brand from name
                    const brand = extractBrand(cigItem.name);
                    
                    if (!results[brand]) results[brand] = [];
                    
                    results[brand].push({
                        itemName: cigItem.name,
                        itemNumber: cigItem.number,
                        upc: item.upc,
                        mustHave: cigItem.mustHave,
                        sold: item.sold,
                        orderQty: orderQty,
                        flag: '✓'
                    });
                }
            });
            
            return { results, anomalies };
        }
        
        function extractBrand(name) {
            if (name.includes('Marlboro')) return '🚬 Marlboro';
            if (name.includes('Newport')) return '🚬 Newport';
            if (name.includes('Pall Mall')) return '🚬 Pall Mall';
            if (name.includes('Camel')) return '🚬 Camel';
            if (name.includes('Lucky Strike')) return '🚬 Lucky Strike';
            if (name.includes('Winston')) return '🚬 Winston';
            if (name.includes('Salem')) return '🚬 Salem';
            if (name.includes('Kool')) return '🚬 Kool';
            if (name.includes('Maverick')) return '🚬 Maverick';
            if (name.includes('Montego')) return '🚬 Montego';
            if (name.includes('24x7')) return '🚬 24x7';
            if (name.includes('American Spirit')) return '🚬 American Spirit';
            if (name.includes('L&M')) return '🚬 L&M';
            return '🚬 Other';
        }
        
        function renderResults(groupedOrders) {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '';
            
            let totalItems = 0;
            let totalOrder = 0;
            let anomalyCount = 0;
            
            Object.entries(groupedOrders).sort().forEach(([brand, items]) => {
                totalItems += items.length;
                items.forEach(item => {
                    totalOrder += item.orderQty;
                    if (item.flag !== '✓') anomalyCount++;
                });
                
                const brandHtml = `
                    <div class="brand-group">
                        <div class="brand-header">
                            <span>${brand}</span>
                            <span>${items.length} items</span>
                        </div>
                        <div class="brand-items">
                            ${items.map(item => `
                                <div class="item-row">
                                    <div data-label="Item">
                                        <div class="item-name">${item.itemName}</div>
                                        <div class="item-number">#${item.itemNumber}</div>
                                    </div>
                                    <div class="value" data-label="Must Have">${item.mustHave}</div>
                                    <div class="value" data-label="Sold">${item.sold.toFixed(1)}</div>
                                    <div class="value" data-label="Stock Left">${(item.mustHave - item.sold).toFixed(1)}</div>
                                    <div class="value order-qty" data-label="Order Qty">${item.orderQty}</div>
                                    <div class="flag-icon ${item.flag === '✓' ? 'flag-normal' : 'flag-anomaly'}">${item.flag}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                container.innerHTML += brandHtml;
            });
            
            document.getElementById('totalItems').textContent = totalItems;
            document.getElementById('totalOrder').textContent = totalOrder.toFixed(0);
            document.getElementById('anomalies').textContent = anomalyCount;
            
            currentOrders = groupedOrders;
        }
        
        async function handlePDFUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            document.getElementById('loading').classList.add('show');
            document.getElementById('errorMsg').classList.remove('show');
            
            try {
                const text = await extractTextFromPDF(file);
                const sales = parseSalesData(text);
                
                if (sales.length === 0) {
                    throw new Error('No sales data found in PDF. Check format.');
                }
                
                const { results } = matchSalesToInventory(sales);
                
                document.getElementById('loading').classList.remove('show');
                document.getElementById('resultsSection').classList.add('show');
                renderResults(results);
            } catch (error) {
                document.getElementById('loading').classList.remove('show');
                showError('Error: ' + error.message);
            }
        }
        
        function showError(message) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }
        
        function exportWhatsApp() {
            let text = '📦 *KC9 Smart Order - ' + new Date().toLocaleDateString() + '*\n\n';
            
            Object.entries(currentOrders).sort().forEach(([brand, items]) => {
                text += `*${brand.replace('🚬 ', '')}*\n`;
                items.forEach(item => {
                    text += `• ${item.itemName} (${item.itemNumber}): *${item.orderQty}* units\n`;
                });
                text += '\n';
            });
            
            const whatsappUrl = `https://wa.me/14046689091?text=${encodeURIComponent(text)}`;
            window.open(whatsappUrl, '_blank');
        }
        
        function exportCSV() {
            let csv = 'Item Name,Item Number,UPC,Must Have,Sold,Order Qty\n';
            
            Object.entries(currentOrders).forEach(([brand, items]) => {
                items.forEach(item => {
                    csv += `"${item.itemName}",${item.itemNumber},${item.upc},${item.mustHave},${item.sold.toFixed(1)},${item.orderQty}\n`;
                });
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'smart-order-' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
        }
        
        document.getElementById('pdfInput').addEventListener('change', handlePDFUpload);
    </script>
</body>
</html>
