<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC9 Smart Ordering</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .timestamp {
            color: #888;
            font-size: 13px;
        }
        .login-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-section input {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            width: 200px;
            margin-right: 10px;
        }
        .login-section button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-section button:hover {
            background: #764ba2;
        }
        .content-section {
            display: none;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .select-all-btn {
            background: #2196F3;
            color: white;
        }
        .select-all-btn:hover {
            background: #1976D2;
        }
        .clear-btn {
            background: #ff9800;
            color: white;
        }
        .clear-btn:hover {
            background: #f57c00;
        }
        .whatsapp-btn {
            background: #4caf50;
            color: white;
            flex: 1;
            min-width: 200px;
            font-size: 16px;
            padding: 12px 20px;
        }
        .whatsapp-btn:hover {
            background: #45a049;
        }
        .whatsapp-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .items-section {
            max-height: 600px;
            overflow-y: auto;
            border: 2px solid #eee;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .item-row {
            display: grid;
            grid-template-columns: 40px 150px 80px 80px 80px 80px 80px auto;
            gap: 10px;
            padding: 15px;
            border-bottom: 1px solid #eee;
            align-items: center;
            background: white;
        }
        .item-row.selected {
            background: #e8f5e9;
        }
        .item-row.grayed-out {
            background: #f5f5f5;
            opacity: 0.7;
        }
        .item-row header {
            display: grid;
            grid-template-columns: 40px 150px 80px 80px 80px 80px 80px auto;
            gap: 10px;
            padding: 12px 15px;
            font-weight: 600;
            background: #667eea;
            color: white;
            border-radius: 8px 8px 0 0;
        }
        .item-row header div {
            text-align: center;
            font-size: 12px;
        }
        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .item-name {
            font-weight: 600;
            color: #333;
            word-break: break-word;
        }
        .item-number {
            color: #666;
            font-size: 12px;
        }
        .value {
            text-align: center;
            font-size: 14px;
        }
        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .status-message.show {
            display: block;
        }
        .status-message.success {
            background: #c8e6c9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }
        .status-message.error {
            background: #ffcdd2;
            color: #c62828;
            border-left: 4px solid #f44336;
        }
        .selected-count {
            padding: 10px 15px;
            background: #e3f2fd;
            border-radius: 6px;
            color: #1565c0;
            font-weight: 600;
        }
        @media (max-width: 1200px) {
            .item-row {
                grid-template-columns: 40px 120px 70px 70px 70px 70px 70px auto;
                font-size: 12px;
                padding: 10px;
            }
            .item-row header {
                grid-template-columns: 40px 120px 70px 70px 70px 70px 70px auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚬 KC9 Smart Ordering</h1>
            <p class="timestamp">Updated: 09/14/2026 at 11:55 PM EST</p>
        </div>

        <div class="login-section" id="loginSection">
            <input type="password" id="passwordInput" placeholder="Enter Manager Password" />
            <button onclick="validateLogin()">Login</button>
        </div>

        <div class="content-section" id="contentSection">
            <div class="status-message" id="statusMessage"></div>

            <div class="controls">
                <button class="select-all-btn" onclick="selectAll()">✓ Select All</button>
                <button class="clear-btn" onclick="clearSelection()">✕ Clear</button>
                <div class="selected-count" id="selectedCount">0 items selected</div>
                <button class="whatsapp-btn" onclick="sendWhatsAppOrder()" id="whatsappBtn" disabled>📱 Send WhatsApp Order</button>
            </div>

            <div class="items-section">
                <div class="item-row">
                    <div></div>
                    <div>Item Name</div>
                    <div>Item #</div>
                    <div>Must Have</div>
                    <div>On Hand</div>
                    <div>Order Qty</div>
                    <div>4-Wk Avg</div>
                    <div>Status</div>
                </div>
                <div id="itemsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const DEPLOYED_URL = 'https://script.google.com/macros/s/AKfycbxne0r1e3dn2IlVk7DW0R5nPe6bCVf2FNu-kyx34NOVonDefvaEEzOVAEsHM7tVU4x_Yg/exec';
        let userPassword = null;
        let items = [];
        let selectedItems = new Set();

        function validateLogin() {
            const password = document.getElementById('passwordInput').value;
            if (!password) {
                showStatus('Please enter a password', 'error');
                return;
            }

            fetch(DEPLOYED_URL + '?action=validatePassword&password=' + encodeURIComponent(password))
                .then(r => r.json())
                .then(result => {
                    if (result.valid) {
                        userPassword = password;
                        document.getElementById('loginSection').style.display = 'none';
                        document.getElementById('contentSection').style.display = 'block';
                        loadItems();
                        showStatus('✓ Logged in successfully', 'success');
                    } else {
                        showStatus('Invalid password', 'error');
                        document.getElementById('passwordInput').value = '';
                    }
                })
                .catch(err => showStatus('Error validating password: ' + err, 'error'));
        }

        function loadItems() {
            fetch(DEPLOYED_URL + '?action=getSmartOrderData')
                .then(r => r.json())
                .then(data => {
                    items = data;
                    displayItems();
                    showStatus(`✓ Loaded ${items.length} items`, 'success');
                })
                .catch(err => showStatus('Error loading items: ' + err, 'error'));
        }

        function displayItems() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';

            items.forEach((item, index) => {
                const isSelected = selectedItems.has(index);
                const orderQty = parseFloat(item.orderQty) || 0;
                const onHand = (parseFloat(item.mustHave) - orderQty).toFixed(1);
                
                const row = document.createElement('div');
                row.className = 'item-row' + (isSelected ? ' selected' : '');
                
                row.innerHTML = `
                    <input type="checkbox" class="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleItem(${index})">
                    <div>
                        <div class="item-name">${item.itemName}</div>
                        <div class="item-number">${item.itemNumber}</div>
                    </div>
                    <div class="value">${item.itemNumber}</div>
                    <div class="value">${item.mustHave}</div>
                    <div class="value">${onHand}</div>
                    <div class="value"><strong>${orderQty}</strong></div>
                    <div class="value">${(parseFloat(item.fourWeekAvg) || 0).toFixed(1)}</div>
                    <div class="value">${isSelected ? '✓ Selected' : '-'}</div>
                `;
                
                container.appendChild(row);
            });

            updateSelectedCount();
        }

        function toggleItem(index) {
            if (selectedItems.has(index)) {
                selectedItems.delete(index);
            } else {
                selectedItems.add(index);
            }
            displayItems();
        }

        function selectAll() {
            selectedItems.clear();
            for (let i = 0; i < items.length; i++) {
                const orderQty = parseFloat(items[i].orderQty) || 0;
                if (orderQty > 0) {
                    selectedItems.add(i);
                }
            }
            displayItems();
        }

        function clearSelection() {
            selectedItems.clear();
            displayItems();
        }

        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = `${selectedItems.size} items selected`;
            document.getElementById('whatsappBtn').disabled = selectedItems.size === 0;
        }

        function sendWhatsAppOrder() {
            if (selectedItems.size === 0) {
                showStatus('Please select items to order', 'error');
                return;
            }

            const selectedData = [];
            let message = '🚬 *KC9 CIGARETTE ORDER* 🚬\n\n';
            
            selectedItems.forEach(index => {
                const item = items[index];
                const orderQty = parseFloat(item.orderQty) || 0;
                
                selectedData.push({
                    itemNumber: item.itemNumber,
                    itemName: item.itemName,
                    mustHave: item.mustHave,
                    onHand: (parseFloat(item.mustHave) - orderQty).toFixed(1),
                    orderQty: orderQty
                });

                message += `*Item:* ${item.itemName}\n`;
                message += `*Item #:* ${item.itemNumber}\n`;
                message += `*Must Order:* ${orderQty}\n`;
                message += `*On Hand:* ${(parseFloat(item.mustHave) - orderQty).toFixed(1)}\n`;
                message += `*Must Have:* ${item.mustHave}\n\n`;
            });

            message += `_Ordered on ${new Date().toLocaleDateString()}_`;

            saveOrderAndSendWhatsApp(selectedData, message);
        }

        function saveOrderAndSendWhatsApp(selectedData, message) {
            const whatsappBtn = document.getElementById('whatsappBtn');
            whatsappBtn.disabled = true;
            whatsappBtn.textContent = 'Saving...';

            fetch(DEPLOYED_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'action=saveSmartOrder&password=' + encodeURIComponent(userPassword) + '&csvData=' + encodeURIComponent(JSON.stringify(selectedData))
            })
            .then(r => r.json())
            .then(result => {
                if (result.success) {
                    showStatus(`✓ Saved ${result.rowsAdded} items to Order Details`, 'success');
                    
                    const encodedMessage = encodeURIComponent(message);
                    window.open(`https://wa.me/14046689091?text=${encodedMessage}`, '_blank');
                    
                    setTimeout(() => {
                        selectedItems.clear();
                        displayItems();
                        whatsappBtn.disabled = false;
                        whatsappBtn.textContent = '📱 Send WhatsApp Order';
                    }, 1000);
                } else {
                    showStatus('Error: ' + (result.error || 'Unknown error'), 'error');
                    whatsappBtn.disabled = false;
                    whatsappBtn.textContent = '📱 Send WhatsApp Order';
                }
            })
            .catch(err => {
                showStatus('Error saving order: ' + err, 'error');
                whatsappBtn.disabled = false;
                whatsappBtn.textContent = '📱 Send WhatsApp Order';
            });
        }

        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        window.addEventListener('load', () => {
            document.getElementById('passwordInput').focus();
        });
    </script>
</body>
</html>
