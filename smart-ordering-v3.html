<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC9 Smart Ordering - Phase 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .timestamp {
            color: #888;
            font-size: 13px;
        }
        .login-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-section input {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            width: 200px;
            margin-right: 10px;
        }
        .login-section button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-section button:hover {
            background: #764ba2;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }
        .items-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .item-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            background: #f9f9f9;
            transition: all 0.3s;
        }
        .item-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }
        .item-card.unverified {
            border-color: #ffa726;
            background: #fff8f0;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .item-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .item-number {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }
        .verification-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            background: #c8e6c9;
            color: #2e7d32;
        }
        .verification-badge.unverified {
            background: #ffe0b2;
            color: #e65100;
        }
        .calc-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }
        .calc-row:last-child {
            border-bottom: none;
        }
        .calc-label {
            color: #666;
            font-weight: 500;
        }
        .calc-value {
            color: #333;
            font-weight: 600;
            font-size: 15px;
        }
        .calc-section {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .breakdown-section {
            background: #f0f4ff;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            border-left: 4px solid #667eea;
        }
        .breakdown-section .calc-row {
            border-bottom-color: rgba(102, 126, 234, 0.2);
        }
        .order-input-section {
            border-top: 2px solid #e0e0e0;
            padding-top: 15px;
            margin-top: 15px;
        }
        .order-input-section label {
            display: block;
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .order-input-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .order-input-section input:focus {
            outline: none;
            border-color: #667eea;
            background: #f0f4ff;
        }
        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .button-group button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .submit-btn {
            background: #4caf50;
            color: white;
        }
        .submit-btn:hover {
            background: #45a049;
        }
        .manual-count-btn {
            background: #2196F3;
            color: white;
        }
        .manual-count-btn:hover {
            background: #0b7dda;
        }
        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .status-message.show {
            display: block;
        }
        .status-message.success {
            background: #c8e6c9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }
        .status-message.error {
            background: #ffcdd2;
            color: #c62828;
            border-left: 4px solid #f44336;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .empty-state p {
            font-size: 16px;
            margin-bottom: 10px;
        }
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .items-container { grid-template-columns: 1fr; }
            .header h1 { font-size: 22px; }
            .search-bar { flex-direction: column; }
            .search-bar input { min-width: unset; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 KC9 Cigarette Smart Order</h1>
            <p class="timestamp">Updated: 09/14/2026 at 7:00 AM EST</p>
        </div>

        <div class="login-section" id="loginSection">
            <input type="password" id="passwordInput" placeholder="Enter Manager Password" />
            <button onclick="validateLogin()">Login</button>
        </div>

        <div id="contentArea" style="display: none;">
            <div class="status-message" id="statusMessage"></div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search by item name or number..." onkeyup="filterItems()">
                <button onclick="location.reload()" style="padding: 12px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Refresh Data</button>
            </div>

            <div class="items-container" id="itemsContainer">
                <div class="empty-state">
                    <p>Loading items...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
      const DEPLOYED_URL = 'https://script.google.com/macros/s/AKfycbxP5W9BDfiXLvNAq5Uk99G4a0qe7WQ9UD2-Iz-ir-3sgOVVG_B155vCxwr-DpqGWhMzUA/exec';
        let userPassword = null;
        let allItems = [];
        let orderData = {};

        function validateLogin() {
            const password = document.getElementById('passwordInput').value;
            if (!password) {
                showStatus('Please enter a password', 'error');
                return;
            }

            fetch(DEPLOYED_URL + '?action=validatePassword&password=' + encodeURIComponent(password))
                .then(r => r.json())
                .then(result => {
                    if (result.valid) {
                        userPassword = password;
                        document.getElementById('loginSection').style.display = 'none';
                        document.getElementById('contentArea').style.display = 'block';
                        loadItems();
                    } else {
                        showStatus('Invalid password', 'error');
                        document.getElementById('passwordInput').value = '';
                    }
                })
                .catch(err => showStatus('Error validating password: ' + err, 'error'));
        }

        function loadItems() {
            fetch(DEPLOYED_URL + '?action=getAllItems')
                .then(r => r.json())
                .then(items => {
                    allItems = items;
                    loadCalculations();
                })
                .catch(err => showStatus('Error loading items: ' + err, 'error'));
        }

        function loadCalculations() {
            fetch(DEPLOYED_URL + '?action=getOrderCalculationFromCache')
                .then(r => r.json())
                .then(calculations => {
                    const calcMap = {};
                    calculations.forEach(row => {
                        calcMap[row['Item Number']] = row;
                    });
                    renderItems(calcMap);
                })
                .catch(err => showStatus('Error loading calculations: ' + err, 'error'));
        }

        function renderItems(calcMap) {
            const container = document.getElementById('itemsContainer');
            if (allItems.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No items found</p></div>';
                return;
            }

            container.innerHTML = allItems.map(item => {
                const itemNum = item['Item Number'];
                const calc = calcMap[itemNum] || {};
                const mustHave = item['Must Have Qty'] || 0;
                const salesBased = calc['Sales Based'] || 0;
                const fourWeekAvg = calc['4 Week Avg'] || 0;
                const onHand = mustHave - salesBased;
                const isUnverified = item['Status'] === 'Pending' || item['Status'] === 'UNVERIFIED';

                return `
                    <div class="item-card ${isUnverified ? 'unverified' : ''}">
                        <div class="item-header">
                            <div>
                                <div class="item-name">${item['Item Name']}</div>
                                <div class="item-number">#${itemNum}</div>
                            </div>
                            <div class="verification-badge ${isUnverified ? 'unverified' : ''}">
                                ${isUnverified ? 'UNVERIFIED' : 'VERIFIED'}
                            </div>
                        </div>

                        <div class="calc-section">
                            <div class="breakdown-section">
                                <div class="calc-row">
                                    <span class="calc-label">Must Have:</span>
                                    <span class="calc-value">${mustHave.toFixed(1)}</span>
                                </div>
                                <div class="calc-row">
                                    <span class="calc-label">- On Hand:</span>
                                    <span class="calc-value">${onHand.toFixed(1)}</span>
                                </div>
                                <div class="calc-row" style="border-top: 1px solid rgba(102, 126, 234, 0.3); padding-top: 8px; margin-top: 8px;">
                                    <span class="calc-label" style="font-weight: 700;">= Order Qty:</span>
                                    <span class="calc-value" style="color: #667eea; font-size: 16px;">${salesBased.toFixed(1)}</span>
                                </div>
                            </div>

                            <div class="calc-row" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #e0e0e0;">
                                <span class="calc-label">4-Week Avg:</span>
                                <span class="calc-value">${fourWeekAvg.toFixed(1)}</span>
                            </div>
                        </div>

                        <div class="order-input-section">
                            <label>Order (Cartons)</label>
                            <input type="number" id="order_${itemNum}" value="${salesBased.toFixed(1)}" step="0.1" min="0">
                            <div class="button-group">
                                <button class="submit-btn" onclick="submitOrder('${itemNum}', '${item['Item Name']}')">Submit Order</button>
                                <button class="manual-count-btn" onclick="toggleManualCount('${itemNum}')">Manual Count</button>
                            </div>
                            <div id="manual_${itemNum}" style="display: none; margin-top: 10px;">
                                <label style="display: block; font-size: 12px; margin-bottom: 5px;">Enter Current Count (Cartons)</label>
                                <input type="number" id="manual_input_${itemNum}" placeholder="Cartons" step="0.1" min="0" style="width: 100%; padding: 8px; border: 2px solid #2196F3; border-radius: 4px;">
                                <button onclick="submitManualCount('${itemNum}', '${item['Item Name']}')" style="width: 100%; margin-top: 8px; padding: 8px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Confirm Manual Count</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleManualCount(itemNum) {
            const manualDiv = document.getElementById('manual_' + itemNum);
            manualDiv.style.display = manualDiv.style.display === 'none' ? 'block' : 'none';
        }

        function submitOrder(itemNum, itemName) {
            const qty = parseFloat(document.getElementById('order_' + itemNum).value);
            if (isNaN(qty) || qty < 0) {
                showStatus('Invalid order quantity', 'error');
                return;
            }

            fetch(DEPLOYED_URL + '?action=saveSmartOrder&password=' + encodeURIComponent(userPassword) + '&itemNumber=' + itemNum + '&itemName=' + encodeURIComponent(itemName) + '&qty=' + qty)
                .then(r => r.json())
                .then(result => {
                    if (result.success) {
                        showStatus(`✓ Order saved: ${itemName} - ${qty} cartons`, 'success');
                    } else {
                        showStatus('Error: ' + (result.error || 'Unknown error'), 'error');
                    }
                })
                .catch(err => showStatus('Error submitting order: ' + err, 'error'));
        }

        function submitManualCount(itemNum, itemName) {
            const qty = parseFloat(document.getElementById('manual_input_' + itemNum).value);
            if (isNaN(qty) || qty < 0) {
                showStatus('Invalid count quantity', 'error');
                return;
            }

            document.getElementById('order_' + itemNum).value = qty.toFixed(1);
            document.getElementById('manual_' + itemNum).style.display = 'none';
            showStatus(`✓ Manual count recorded: ${itemName} - ${qty} cartons`, 'success');
        }

        function filterItems() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.item-card').forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(search) ? '' : 'none';
            });
        }

        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        window.addEventListener('load', () => {
            document.getElementById('passwordInput').focus();
        });
    </script>
</body>
</html>
