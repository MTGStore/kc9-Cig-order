<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC9 Smart Ordering - Phase 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }
        .header h1 { color: #333; font-size: 28px; margin-bottom: 5px; }
        .timestamp { color: #888; font-size: 13px; }
        .login-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-section input {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            width: 200px;
            margin-right: 10px;
        }
        .login-section button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-section button:hover { background: #764ba2; }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .toolbar input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        .toolbar input:focus { outline: none; border-color: #667eea; }
        .toolbar button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        .toolbar button:hover { background: #764ba2; }
        .whatsapp-btn {
            background: #25D366 !important;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .whatsapp-btn:hover { background: #20ba5a !important; }
        .sort-btn { background: #f39c12 !important; }
        .sort-btn:hover { background: #d68910 !important; }
        .items-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .item-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            background: #f9f9f9;
            transition: all 0.3s;
        }
        .item-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }
        .item-card.order-submitted {
            border-color: #4caf50 !important;
            background: #f0fff4 !important;
            transform: none !important;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .item-name { font-size: 18px; font-weight: 600; color: #333; }
        .item-number { font-size: 12px; color: #999; margin-top: 3px; }
        .calc-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }
        .calc-row:last-child { border-bottom: none; }
        .calc-label { color: #666; font-weight: 500; }
        .calc-value { color: #333; font-weight: 600; font-size: 15px; }
        .calc-section {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .breakdown-section {
            background: #f0f4ff;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            border-left: 4px solid #667eea;
        }
        .breakdown-section .calc-row { border-bottom-color: rgba(102, 126, 234, 0.2); }
        .order-input-section {
            border-top: 2px solid #e0e0e0;
            padding-top: 15px;
            margin-top: 15px;
        }
        .order-input-section label {
            display: block;
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .order-input-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .order-input-section input:focus {
            outline: none;
            border-color: #667eea;
            background: #f0f4ff;
        }
        .order-input-section input:disabled {
            background: #f0fff4;
            border-color: #4caf50;
            color: #2e7d32;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .button-group button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .submit-btn {
            background: #4caf50;
            color: white;
        }
        .submit-btn:hover { background: #45a049; }
        .submit-btn:disabled {
            background: #a5d6a7;
            cursor: not-allowed;
        }
        /* ── ORDER CONFIRMED BANNER ── */
        .order-confirmed-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #e8f5e9;
            border: 1px solid #4caf50;
            border-radius: 6px;
            padding: 10px 14px;
            margin-top: 12px;
            color: #2e7d32;
            font-weight: 600;
            font-size: 14px;
        }
        .order-confirmed-banner .check-icon {
            font-size: 18px;
        }
        .order-confirmed-banner .order-time {
            font-size: 11px;
            color: #4caf50;
            font-weight: 400;
            margin-left: auto;
        }
        .status-message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }
        .status-message.show { display: block; }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .items-container { grid-template-columns: 1fr; }
            .header h1 { font-size: 22px; }
            .toolbar { flex-direction: column; }
            .toolbar input { min-width: unset; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 KC9 Cigarette Smart Order</h1>
            <p class="timestamp">Updated: 09/21/2026 at 11:42 AM EST</p>
        </div>

        <div class="login-section" id="loginSection">
            <input type="password" id="passwordInput" placeholder="Enter Manager Password" />
            <button onclick="validateLogin()">Login</button>
        </div>

        <div id="contentArea" style="display: none;">
            <div class="status-message" id="statusMessage"></div>

            <div class="toolbar">
                <input type="text" id="searchInput" placeholder="🔍 Search by item name or number..." onkeyup="filterItems()">
                <button onclick="location.reload()">Refresh Data</button>
                <button class="sort-btn" onclick="sortItems()" id="sortBtn">📊 Sort: 4-Wk Avg ↓</button>
                <button class="whatsapp-btn" onclick="sendOrdersViaWhatsApp()">📱 WhatsApp Orders</button>
            </div>

            <div class="items-container" id="itemsContainer">
                <div class="empty-state"><p>Loading items...</p></div>
            </div>
        </div>
    </div>

    <script>
        const DEPLOYED_URL = 'https://script.google.com/macros/s/AKfycbxne0r1e3dn2IlVk7DW0R5nPe6bCVf2FNu-kyx34NOVonDefvaEEzOVAEsHM7tVU4x_Yg/exec';
        let userPassword = null;
        let allItems = [];
        let sortMode = 'avg';

        function validateLogin() {
            const password = document.getElementById('passwordInput').value;
            if (!password) { showStatus('Please enter a password', 'error'); return; }
            fetch(DEPLOYED_URL + '?action=validatePassword&password=' + encodeURIComponent(password))
                .then(r => r.json())
                .then(result => {
                    if (result.valid) {
                        userPassword = password;
                        document.getElementById('loginSection').style.display = 'none';
                        document.getElementById('contentArea').style.display = 'block';
                        loadItems();
                    } else {
                        showStatus('Invalid password', 'error');
                        document.getElementById('passwordInput').value = '';
                    }
                })
                .catch(err => showStatus('Error validating password: ' + err, 'error'));
        }

        function loadItems() {
            fetch(DEPLOYED_URL + '?action=getSmartOrderData')
                .then(r => r.json())
                .then(items => {
                    if (Array.isArray(items)) {
                        allItems = items;
                        sortAndRender();
                    } else {
                        showStatus('Error: Invalid data format', 'error');
                    }
                })
                .catch(err => showStatus('Error loading items: ' + err, 'error'));
        }

        function sortItems() {
            sortMode = (sortMode === 'avg') ? 'orderqty' : 'avg';
            document.getElementById('sortBtn').textContent = sortMode === 'avg'
                ? '📊 Sort: 4-Wk Avg ↓'
                : '📦 Sort: Order Qty ↓';
            sortAndRender();
        }

        function sortAndRender() {
            const sorted = [...allItems].sort((a, b) => {
                if (sortMode === 'avg') return (b['fourWeekAvg'] || 0) - (a['fourWeekAvg'] || 0);
                return (b['orderQty'] || 0) - (a['orderQty'] || 0);
            });
            renderItems(sorted);
        }

        function renderItems(items) {
            const container = document.getElementById('itemsContainer');
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No items found</p></div>';
                return;
            }

            container.innerHTML = items.map(item => {
                const itemNum     = item['itemNumber'];
                const itemName    = item['itemName'];
                const mustHave    = item['mustHave'] || 0;
                const orderQty    = item['orderQty'] || 0;
                const fourWeekAvg = item['fourWeekAvg'] || 0;
                const onHand      = item['onHand'] !== undefined ? item['onHand'] : (mustHave - orderQty);

                return `
                    <div class="item-card" id="card_${itemNum}">
                        <div class="item-header">
                            <div>
                                <div class="item-name">${itemName}</div>
                                <div class="item-number">#${itemNum}</div>
                            </div>
                        </div>

                        <div class="calc-section">
                            <div class="breakdown-section">
                                <div class="calc-row">
                                    <span class="calc-label">Must Have:</span>
                                    <span class="calc-value">${mustHave.toFixed(1)}</span>
                                </div>
                                <div class="calc-row">
                                    <span class="calc-label">- On Hand:</span>
                                    <span class="calc-value">${onHand.toFixed(1)}</span>
                                </div>
                                <div class="calc-row" style="border-top: 1px solid rgba(102,126,234,0.3); padding-top: 8px; margin-top: 8px;">
                                    <span class="calc-label" style="font-weight:700;">= Order Qty:</span>
                                    <span class="calc-value" style="color:#667eea;font-size:16px;">${orderQty.toFixed(1)}</span>
                                </div>
                            </div>

                            <div class="calc-row" style="margin-top:12px;padding-top:12px;border-top:1px solid #e0e0e0;">
                                <span class="calc-label">4-Week Avg:</span>
                                <span class="calc-value">${fourWeekAvg.toFixed(1)}</span>
                            </div>
                        </div>

                        <div class="order-input-section" id="inputSection_${itemNum}">
                            <label>Order (Cartons)</label>
                            <input type="number" id="order_${itemNum}" value="${orderQty.toFixed(1)}" step="0.1" min="0">
                            <div class="button-group">
                                <button class="submit-btn" id="btn_${itemNum}" onclick="submitOrder('${itemNum}', '${itemName}')">Submit Order</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function submitOrder(itemNum, itemName) {
            const btn = document.getElementById('btn_' + itemNum);
            const input = document.getElementById('order_' + itemNum);
            const card = document.getElementById('card_' + itemNum);

            const qty = parseFloat(input.value);
            if (isNaN(qty) || qty < 0) {
                showStatus('Invalid order quantity', 'error');
                return;
            }

            // Disable button immediately to prevent double-click
            btn.disabled = true;
            btn.textContent = '⏳ Saving...';

            const params = new URLSearchParams();
            params.append('action', 'saveSmartOrder');
            params.append('password', userPassword);
            params.append('itemNumber', itemNum);
            params.append('itemName', itemName);
            params.append('qty', qty);

            fetch(DEPLOYED_URL, { method: 'POST', body: params })
                .then(r => r.json())
                .then(result => {
                    if (result.success) {
                        // Gray out the card and show confirmation
                        card.classList.add('order-submitted');
                        input.disabled = true;
                        btn.disabled = true;
                        btn.textContent = '✓ Submitted';
                        btn.style.background = '#4caf50';

                        // Add confirmation banner above button
                        const now = new Date();
                        const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                        const banner = document.createElement('div');
                        banner.className = 'order-confirmed-banner';
                        banner.innerHTML = `
                            <span class="check-icon">✅</span>
                            <span>Order saved — ${qty.toFixed(1)} cartons</span>
                            <span class="order-time">${timeStr}</span>
                        `;
                        document.getElementById('inputSection_' + itemNum).appendChild(banner);

                    } else {
                        btn.disabled = false;
                        btn.textContent = 'Submit Order';
                        showStatus('Error: ' + (result.error || 'Unknown error'), 'error');
                    }
                })
                .catch(err => {
                    btn.disabled = false;
                    btn.textContent = 'Submit Order';
                    showStatus('Error submitting order: ' + err, 'error');
                });
        }

        function sendOrdersViaWhatsApp() {
            let totalQty = 0;
            let itemsCount = 0;
            let message = 'KC9 CIGARETTE ORDER\n';
            message += 'Date: ' + new Date().toLocaleDateString('en-US', {year:'numeric',month:'2-digit',day:'2-digit'}) + '\n';
            message += 'Counted by: Harry\n';
            message += '════════════════════════════\n\n';

            const items = [];
            for (let i = 0; i < allItems.length; i++) {
                const itemNum = allItems[i]['itemNumber'];
                const orderQtyInput = document.getElementById('order_' + itemNum);
                if (orderQtyInput) {
                    const qty = parseFloat(orderQtyInput.value) || 0;
                    if (qty > 0) {
                        items.push({ name: allItems[i]['itemName'], number: itemNum, qty: qty });
                        totalQty += qty;
                        itemsCount++;
                    }
                }
            }

            if (items.length === 0) { showStatus('No items to order', 'error'); return; }

            items.forEach(item => {
                message += 'Item Name: ' + item.name + '\n';
                message += 'Item #: ' + item.number + '\n';
                message += 'Order Qty: ' + item.qty.toFixed(2) + ' cartons\n\n';
            });

            message += '════════════════════════════\n';
            message += 'TOTAL CARTONS TO ORDER: ' + totalQty.toFixed(2) + '\n';
            message += 'ITEMS NEEDING ORDER: ' + itemsCount;

            window.open('https://wa.me/14046689091?text=' + encodeURIComponent(message), '_blank');
        }

        function filterItems() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.item-card').forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(search) ? '' : 'none';
            });
        }

        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        window.addEventListener('load', () => {
            document.getElementById('passwordInput').focus();
        });
    </script>
</body>
</html>
