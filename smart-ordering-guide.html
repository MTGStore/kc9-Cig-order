<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTd_bxsSBdp3hm_FgByFlxVUsRnFSDQtaJorcORmi5QzqmsbWRZEbZ3reIDjpjXr4ouQ/exec';
let allItems = {};
let orderCalcData = {};

async function loadData() {
  try {
    console.log('Fetching items and order calculations...');
    
    // Fetch all items
    const itemsResponse = await fetch(APPS_SCRIPT_URL + '?action=getAllItems');
    if (!itemsResponse.ok) throw new Error(`Items fetch failed: ${itemsResponse.status}`);
    allItems = await itemsResponse.json();
    
    // Fetch order calculations (cache)
    const calcResponse = await fetch(APPS_SCRIPT_URL + '?action=getOrderCalculationFromCache');
    if (!calcResponse.ok) throw new Error(`Calc fetch failed: ${calcResponse.status}`);
    orderCalcData = await calcResponse.json();
    
    if (!allItems || Object.keys(allItems).length === 0) {
      throw new Error('No items loaded from Main CIG LIST');
    }
    
    if (!orderCalcData || Object.keys(orderCalcData).length === 0) {
      throw new Error('No order calculations available. Run calculateAndCacheOrders() in Apps Script first.');
    }
    
    renderItems();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    
  } catch (error) {
    console.error('Error:', error);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').innerHTML = `<strong>⚠️ Error:</strong><br>${error.message}`;
  }
}

function filterItems() {
  renderItems();
}

function renderItems() {
  const statusFilter = document.getElementById('statusFilter').value;
  const searchTerm = document.getElementById('searchBox').value.toLowerCase();
  
  const grid = document.getElementById('itemsGrid');
  grid.innerHTML = '';
  
  let lowStockCount = 0;
  let notOrderedCount = 0;
  let renderedCount = 0;
  
  for (const itemNum in allItems) {
    const item = allItems[itemNum];
    const calc = orderCalcData[itemNum] || { sales_based: 0, four_week_avg: 0 };
    
    // Filter by search
    if (searchTerm && !item.name.toLowerCase().includes(searchTerm) && !itemNum.includes(searchTerm)) {
      continue;
    }
    
    // Determine status
    let status = 'good';
    if (calc.sales_based > item.must_have * 0.5) {
      status = 'low';
      lowStockCount++;
    }
    if (calc.sales_based >= item.must_have) {
      status = 'alert';
      notOrderedCount++;
    }
    
    // Filter by status
    if (statusFilter !== 'all' && status !== statusFilter) {
      continue;
    }
    
    let statusClass = `status-${status}`;
    let statusText = '';
    if (status === 'good') statusText = '✅ Good Stock';
    else if (status === 'low') statusText = '⚠️ Low Stock';
    else if (status === 'alert') statusText = '🔴 Order Now';
    
    const card = document.createElement('div');
    card.className = `item-card ${status === 'alert' ? 'alert' : status === 'low' ? 'low-stock' : ''}`;
    card.innerHTML = `
      <div class="item-name">${item.name}</div>
      <div class="item-number">#${itemNum}</div>
      
      <div class="stat-row">
        <span class="stat-label">Must Have</span>
        <span class="stat-value">${item.must_have}</span>
      </div>
      
      <div class="stat-row">
        <span class="stat-label">On Hand</span>
        <span class="stat-value">${(item.must_have - calc.sales_based).toFixed(1)}</span>
      </div>
      
      <div class="stat-row">
        <span class="stat-label">Sales Based</span>
        <span class="stat-value">${calc.sales_based.toFixed(1)}</span>
      </div>
      
      <div class="stat-row">
        <span class="stat-label">4-Week Avg</span>
        <span class="stat-value">${calc.four_week_avg.toFixed(1)}/wk</span>
      </div>
      
      <div class="recommended-qty">
        📦 Order: ${calc.sales_based.toFixed(1)} units
      </div>
      
      <span class="status-badge ${statusClass}">${statusText}</span>
    `;
    
    grid.appendChild(card);
    renderedCount++;
  }
  
  // Update summary
  document.getElementById('activeItems').textContent = Object.keys(allItems).length;
  document.getElementById('lowStockCount').textContent = lowStockCount;
  document.getElementById('notOrderedCount').textContent = notOrderedCount;
  
  if (renderedCount === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: white; font-size: 1.2em;">No items match your filter</div>';
  }
}

window.addEventListener('load', loadData);
</script>
