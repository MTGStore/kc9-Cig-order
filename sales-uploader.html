<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC9 Sales Uploader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .timestamp {
            color: #888;
            font-size: 13px;
        }
        .login-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-section input {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            width: 200px;
            margin-right: 10px;
        }
        .login-section button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-section button:hover {
            background: #764ba2;
        }
        .upload-section {
            display: none;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .form-group input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        .form-group input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            background: #f0f4ff;
            border-color: #764ba2;
        }
        .upload-area.dragging {
            background: #e8eef7;
            border-color: #667eea;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-area p {
            color: #666;
            font-size: 16px;
            margin: 0;
        }
        .preview-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            max-height: 500px;
            overflow-y: auto;
        }
        .preview-section h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .preview-table th {
            background: #667eea;
            color: white;
            padding: 10px;
            text-align: left;
            font-weight: 600;
        }
        .preview-table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .preview-table input {
            width: 100%;
            padding: 5px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }
        .preview-table input:focus {
            outline: none;
            border-color: #667eea;
        }
        .preview-table input:disabled {
            background: #e8f5e9;
            border-color: #4caf50;
            color: #2e7d32;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-matched {
            background: #c8e6c9;
            color: #2e7d32;
        }
        .status-pending {
            background: #ffe0b2;
            color: #e65100;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .button-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .upload-btn {
            background: #4caf50;
            color: white;
        }
        .upload-btn:hover {
            background: #45a049;
        }
        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .cancel-btn {
            background: #f44336;
            color: white;
        }
        .cancel-btn:hover {
            background: #da190b;
        }
        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .status-message.show {
            display: block;
        }
        .status-message.success {
            background: #c8e6c9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }
        .status-message.error {
            background: #ffcdd2;
            color: #c62828;
            border-left: 4px solid #f44336;
        }
        .validation-info {
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📤 KC9 Sales Uploader</h1>
            <p class="timestamp">Updated: 09/18/2026 at 12:53 PM EST</p>
        </div>

        <div class="login-section" id="loginSection">
            <input type="password" id="passwordInput" placeholder="Enter Manager Password" />
            <button onclick="validateLogin()">Login</button>
        </div>

        <div class="upload-section" id="uploadSection">
            <div class="status-message" id="statusMessage"></div>

            <div class="form-group">
                <label for="salesDate">Sales Date:</label>
                <input type="date" id="salesDate" />
            </div>

            <div class="form-group">
                <label>Upload CSV File</label>
                <div class="upload-area" id="uploadArea" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept=".csv,.txt" onchange="handleFileSelect(event)">
                    <p>📁 Drag and drop CSV file here or click to select</p>
                </div>
            </div>

            <div class="preview-section" id="previewSection">
                <h3>Preview - Match UPCs & Enter Item Numbers</h3>
                <table class="preview-table" id="previewTable">
                    <thead>
                        <tr>
                            <th>UPC</th>
                            <th>Item Name</th>
                            <th>Item #</th>
                            <th>Packs</th>
                            <th>Cartons</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="previewBody"></tbody>
                </table>
                <div class="validation-info" id="validationInfo"></div>
            </div>

            <div class="button-group" id="buttonGroup" style="display: none;">
                <button class="upload-btn" onclick="uploadData()" id="uploadBtn">Upload to Sheets</button>
                <button class="cancel-btn" onclick="resetForm()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const DEPLOYED_URL = 'https://script.google.com/macros/s/AKfycbxne0r1e3dn2IlVk7DW0R5nPe6bCVf2FNu-kyx34NOVonDefvaEEzOVAEsHM7tVU4x_Yg/exec';
        let userPassword = null;
        let fileData = [];
        let upcMapping = {};

        function validateLogin() {
            const password = document.getElementById('passwordInput').value;
            if (!password) {
                showStatus('Please enter a password', 'error');
                return;
            }

            fetch(DEPLOYED_URL + '?action=validatePassword&password=' + encodeURIComponent(password))
                .then(r => r.json())
                .then(result => {
                    if (result.valid) {
                        userPassword = password;
                        document.getElementById('loginSection').style.display = 'none';
                        document.getElementById('uploadSection').style.display = 'block';
                        
                        const today = new Date().toISOString().split('T')[0];
                        document.getElementById('salesDate').value = today;
                        
                        loadUPCMapping();
                        showStatus('✓ Logged in successfully', 'success');
                    } else {
                        showStatus('Invalid password', 'error');
                        document.getElementById('passwordInput').value = '';
                    }
                })
                .catch(err => showStatus('Error validating password: ' + err, 'error'));
        }

        function loadUPCMapping() {
            fetch(DEPLOYED_URL + '?action=getUPCMapping')
                .then(r => r.json())
                .then(result => {
                    console.log('Raw result from Apps Script:', result);
                    upcMapping = {};
                    
                    let data = result;
                    if (result && typeof result === 'object' && result.result) {
                        data = result.result;
                    }
                    
                    if (!Array.isArray(data)) {
                        console.log('UPC data is not array:', data);
                        showStatus('Error: UPC data format invalid', 'error');
                        return;
                    }
                    
                    data.forEach(row => {
                        const upc = String(row['CSV UPC Code'] || row[0]).trim();
                        upcMapping[upc] = {
                            itemNumber: String(row['Item Number'] || row[1]).trim(),
                            itemName: String(row['Item Name'] || row[2]).trim()
                        };
                    });
                    console.log('UPC Mapping loaded:', Object.keys(upcMapping).length, 'entries');
                })
                .catch(err => {
                    console.log('Error loading UPC mapping:', err);
                    showStatus('Error loading UPC mapping: ' + err, 'error');
                });
        }

        function handleDragOver(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.add('dragging');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('dragging');
        }

        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('dragging');
            processFiles(e.dataTransfer.files);
        }

        function handleFileSelect(e) {
            processFiles(e.target.files);
        }

        function processFiles(files) {
            fileData = [];
            if (files.length === 0) return;

            const reader = new FileReader();
            
            reader.onerror = function() {
                showStatus('Error reading file', 'error');
            };

            reader.onload = function(e) {
                try {
                    const csv = e.target.result;
                    const lines = csv.split('\n');
                    const salesDate = document.getElementById('salesDate').value;

                    for (let i = 1; i < lines.length; i++) {
                        if (lines[i].trim() === '') continue;
                        
                        const fields = lines[i].includes('\t') ? lines[i].split('\t') : lines[i].split(',');
                        if (fields.length < 3) continue;

                        const upc = String(fields[0]).trim();
                        const itemName = String(fields[1]).trim();
                        const packsSold = parseFloat(fields[2]) || 0;
                        const cartonsQty = (packsSold / 10).toFixed(2);

                        let matchedItemNum = '';
                        let isMatched = false;

                        if (upcMapping[upc]) {
                            matchedItemNum = upcMapping[upc].itemNumber;
                            isMatched = true;
                        }

                        fileData.push({
                            upc: upc,
                            itemName: itemName,
                            itemNumber: matchedItemNum,
                            isMatched: isMatched,
                            packs: packsSold,
                            cartons: cartonsQty,
                            salesDate: salesDate
                        });
                    }

                    displayPreview();
                } catch (err) {
                    showStatus('Error processing file: ' + err, 'error');
                }
            };
            
            reader.readAsText(files[0]);
        }

        function displayPreview() {
            const previewBody = document.getElementById('previewBody');
            previewBody.innerHTML = '';

            for (let i = 0; i < fileData.length; i++) {
                const row = fileData[i];
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>${row.upc}</td>
                    <td>${row.itemName}</td>
                    <td><input type="text" value="${row.itemNumber}" onchange="updateItemNumber(${i}, this.value)" ${row.isMatched ? 'disabled' : ''}></td>
                    <td>${row.packs}</td>
                    <td>${row.cartons}</td>
                    <td><span class="status-badge ${row.isMatched ? 'status-matched' : 'status-pending'}">${row.isMatched ? 'Matched' : 'Pending'}</span></td>
                `;
                previewBody.appendChild(tr);
            }

            updateValidationInfo();
            document.getElementById('previewSection').style.display = 'block';
            document.getElementById('buttonGroup').style.display = 'flex';
        }

        function updateItemNumber(index, value) {
            fileData[index].itemNumber = value.trim();
            updateValidationInfo();
        }

        function updateValidationInfo() {
            const completed = fileData.filter(r => r.itemNumber).length;
            const total = fileData.length;
            const uploadBtn = document.getElementById('uploadBtn');
            
            if (completed === total && total > 0) {
                document.getElementById('validationInfo').textContent = `✓ All ${total} rows ready to upload`;
                uploadBtn.disabled = false;
            } else {
                document.getElementById('validationInfo').textContent = `⚠ ${completed}/${total} rows have Item Numbers (${total - completed} still needed)`;
                uploadBtn.disabled = true;
            }
        }

        function uploadData() {
            if (fileData.length === 0) {
                showStatus('No data to upload', 'error');
                return;
            }

            const incomplete = fileData.filter(r => !r.itemNumber);
            if (incomplete.length > 0) {
                showStatus(`${incomplete.length} rows missing Item Numbers`, 'error');
                return;
            }

            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';

            const uploadDate = new Date().toISOString().split('T')[0];
            const salesDate = document.getElementById('salesDate').value;

            const salesData = fileData.map(item => ({
                upc: item.upc,
                description: item.itemName,
                qty: item.packs
            }));

            const params = new URLSearchParams();
            params.append('action', 'uploadSalesHistory');
            params.append('password', userPassword);
            params.append('uploadDate', uploadDate);
            params.append('salesStartDate', salesDate);
            params.append('salesEndDate', salesDate);
            params.append('salesData', JSON.stringify(salesData));

            fetch(DEPLOYED_URL, {
                method: 'POST',
                body: params
            })
            .then(r => r.json())
            .then(result => {
                if (result.success) {
                    showStatus(`✓ Uploaded ${fileData.length} rows successfully!`, 'success');
                    resetForm();
                } else {
                    showStatus('Error: ' + (result.error || 'Unknown error'), 'error');
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = 'Upload to Sheets';
                }
            })
            .catch(err => {
                showStatus('Error uploading data: ' + err, 'error');
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload to Sheets';
            });
        }

        function resetForm() {
            fileData = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('buttonGroup').style.display = 'none';
        }

        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        window.addEventListener('load', () => {
            document.getElementById('passwordInput').focus();
        });
    </script>
</body>
</html>
