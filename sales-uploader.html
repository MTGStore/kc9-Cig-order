<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC9 Sales Uploader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .timestamp {
            color: #888;
            font-size: 13px;
        }
        .login-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-section input {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            width: 200px;
            margin-right: 10px;
        }
        .login-section button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-section button:hover {
            background: #764ba2;
        }
        .upload-section {
            display: none;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            background: #f0f4ff;
            border-color: #764ba2;
        }
        .upload-area.dragging {
            background: #e8eef7;
            border-color: #667eea;
        }
        .upload-area input {
            display: none;
        }
        .upload-area p {
            color: #666;
            font-size: 16px;
            margin: 0;
        }
        .preview-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .preview-section h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .preview-table th, .preview-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .preview-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }
        .preview-table tr:hover {
            background: #f5f5f5;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-verified {
            background: #c8e6c9;
            color: #2e7d32;
        }
        .status-pending {
            background: #ffe0b2;
            color: #e65100;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .button-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-btn {
            background: #4caf50;
            color: white;
        }
        .upload-btn:hover {
            background: #45a049;
        }
        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .cancel-btn {
            background: #f44336;
            color: white;
        }
        .cancel-btn:hover {
            background: #da190b;
        }
        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .status-message.show {
            display: block;
        }
        .status-message.success {
            background: #c8e6c9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }
        .status-message.error {
            background: #ffcdd2;
            color: #c62828;
            border-left: 4px solid #f44336;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #4caf50;
            width: 0%;
            transition: width 0.3s;
        }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            .header h1 { font-size: 22px; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📤 KC9 Sales Uploader</h1>
            <p class="timestamp">Updated: 09/14/2026 at 10:20 PM EST</p>
        </div>

        <div class="login-section" id="loginSection">
            <input type="password" id="passwordInput" placeholder="Enter Manager Password" />
            <button onclick="validateLogin()">Login</button>
        </div>

        <div class="upload-section" id="uploadSection">
            <div class="status-message" id="statusMessage"></div>

            <div class="upload-area" id="uploadArea" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                <input type="file" id="fileInput" accept=".csv,.txt" onchange="handleFileSelect(event)" multiple>
                <p>📁 Drag and drop CSV files here or click to select</p>
            </div>

            <div class="preview-section" id="previewSection">
                <h3>Preview (First 20 rows)</h3>
                <table class="preview-table" id="previewTable">
                    <thead>
                        <tr>
                            <th>Upload Date</th>
                            <th>Sales Date</th>
                            <th>Item Name</th>
                            <th>UPC</th>
                            <th>Qty</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="previewBody"></tbody>
                </table>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            </div>

            <div class="button-group" id="buttonGroup" style="display: none;">
                <button class="upload-btn" onclick="uploadData()">Upload to Sheets</button>
                <button class="cancel-btn" onclick="resetForm()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const DEPLOYED_URL = 'https://script.google.com/macros/s/AKfycbxne0r1e3dn2IlVk7DW0R5nPe6bCVf2FNu-kyx34NOVonDefvaEEzOVAEsHM7tVU4x_Yg/exec';
        let userPassword = null;
        let fileData = [];

        function validateLogin() {
            const password = document.getElementById('passwordInput').value;
            if (!password) {
                showStatus('Please enter a password', 'error');
                return;
            }

            fetch(DEPLOYED_URL + '?action=validatePassword&password=' + encodeURIComponent(password))
                .then(r => r.json())
                .then(result => {
                    if (result.valid) {
                        userPassword = password;
                        document.getElementById('loginSection').style.display = 'none';
                        document.getElementById('uploadSection').style.display = 'block';
                        showStatus('✓ Logged in successfully', 'success');
                    } else {
                        showStatus('Invalid password', 'error');
                        document.getElementById('passwordInput').value = '';
                    }
                })
                .catch(err => showStatus('Error validating password: ' + err, 'error'));
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('uploadArea').classList.add('dragging');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('uploadArea').classList.remove('dragging');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('uploadArea').classList.remove('dragging');
            const files = e.dataTransfer.files;
            processFiles(files);
        }

        function handleFileSelect(e) {
            processFiles(e.target.files);
        }

        function processFiles(files) {
            fileData = [];
            let filesProcessed = 0;

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const csv = e.target.result;
                    const lines = csv.split('\n');
                    const uploadDate = new Date().toISOString().split('T')[0];

                    for (let i = 1; i < lines.length; i++) {
                        if (lines[i].trim() === '') continue;
                        const fields = lines[i].split('\t');
                        if (fields.length < 7) continue;

                        fileData.push({
                            uploadDate: uploadDate,
                            salesDate: fields[1],
                            itemName: fields[3],
                            upc: fields[4],
                            qty: fields[6],
                            status: 'Verified'
                        });
                    }

                    filesProcessed++;
                    if (filesProcessed === files.length) {
                        displayPreview();
                    }
                };
                reader.readAsText(file);
            }
        }

        function displayPreview() {
            const previewBody = document.getElementById('previewBody');
            previewBody.innerHTML = '';

            const rowsToShow = Math.min(fileData.length, 20);
            for (let i = 0; i < rowsToShow; i++) {
                const row = fileData[i];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.uploadDate}</td>
                    <td>${row.salesDate}</td>
                    <td>${row.itemName}</td>
                    <td>${row.upc}</td>
                    <td>${row.qty}</td>
                    <td><span class="status-badge status-verified">${row.status}</span></td>
                `;
                previewBody.appendChild(tr);
            }

            document.getElementById('previewSection').style.display = 'block';
            document.getElementById('buttonGroup').style.display = 'flex';
            updateProgress();
        }

        function updateProgress() {
            const progress = (fileData.length / 166) * 100;
            document.getElementById('progressFill').style.width = Math.min(progress, 100) + '%';
        }

        function uploadData() {
            if (fileData.length === 0) {
                showStatus('No data to upload', 'error');
                return;
            }

            const uploadBtn = document.querySelector('.upload-btn');
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';

            fetch(DEPLOYED_URL + '?action=uploadSalesHistory&password=' + encodeURIComponent(userPassword) + '&csvData=' + encodeURIComponent(JSON.stringify(fileData)))
                .then(r => r.json())
                .then(result => {
                    if (result.success) {
                        showStatus(`✓ Uploaded ${result.rowsAdded} rows successfully!`, 'success');
                        resetForm();
                    } else {
                        showStatus('Error: ' + (result.error || 'Unknown error'), 'error');
                        uploadBtn.disabled = false;
                        uploadBtn.textContent = 'Upload to Sheets';
                    }
                })
                .catch(err => {
                    showStatus('Error uploading data: ' + err, 'error');
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = 'Upload to Sheets';
                });
        }

        function resetForm() {
            fileData = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('buttonGroup').style.display = 'none';
            document.getElementById('progressFill').style.width = '0%';
        }

        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        window.addEventListener('load', () => {
            document.getElementById('passwordInput').focus();
        });
    </script>
</body>
</html>
