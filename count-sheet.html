<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC9 Full Inventory Count Sheet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }
        .header h1 { color: #333; font-size: 26px; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }
        .meta-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .meta-field { flex: 1; min-width: 180px; }
        .meta-field label {
            display: block;
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .meta-field input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        /* ── BARCODE SCANNER SECTION ── */
        .scanner-section {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            color: white;
        }
        .scanner-section h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .scanner-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .scanner-input-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .scanner-input-wrap .scan-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }
        #barcodeInput {
            width: 100%;
            padding: 12px 12px 12px 44px;
            font-size: 18px;
            font-weight: 700;
            border: 2px solid #4a5568;
            border-radius: 8px;
            background: #2d3748;
            color: #68d391;
            letter-spacing: 2px;
        }
        #barcodeInput:focus {
            outline: none;
            border-color: #68d391;
            background: #1a202c;
        }
        #barcodeInput::placeholder { color: #4a5568; letter-spacing: 0; font-size: 14px; }
        .scan-result {
            margin-top: 12px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
        .scan-result.found {
            background: rgba(104, 211, 145, 0.15);
            border: 1px solid #68d391;
            color: #68d391;
            display: block;
        }
        .scan-result.not-found {
            background: rgba(252, 129, 74, 0.15);
            border: 1px solid #fc814a;
            color: #fc814a;
            display: block;
        }
        .scan-result.new-upc {
            background: rgba(246, 224, 94, 0.15);
            border: 1px solid #f6e05e;
            color: #f6e05e;
            display: block;
        }
        .upc-stats {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .upc-stat {
            font-size: 12px;
            color: #718096;
        }
        .upc-stat span { color: #a0aec0; font-weight: 700; }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .toolbar button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-load { background: #667eea; color: white; }
        .btn-load:hover { background: #764ba2; }
        .btn-print { background: #4caf50; color: white; }
        .btn-print:hover { background: #45a049; }
        .btn-clear { background: #e74c3c; color: white; }
        .btn-clear:hover { background: #c0392b; }
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .summary-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .summary-chip {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .chip-total { background: #e8eaf6; color: #3949ab; }
        .chip-counted { background: #e8f5e9; color: #2e7d32; }
        .chip-remaining { background: #fff3e0; color: #e65100; }
        .chip-newupc { background: #fff8e1; color: #f57f17; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead tr { background: #667eea; color: white; }
        thead th {
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }
        tbody tr { border-bottom: 1px solid #eee; transition: background 0.2s; }
        tbody tr:nth-child(even) { background: #f8f9ff; }
        tbody tr:hover { background: #f0f4ff; }
        tbody tr.counted { background: #f0fff4 !important; }
        tbody tr.highlighted {
            background: #fffde7 !important;
            border: 2px solid #f6e05e;
            animation: pulse 0.5s ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.01); }
            100% { transform: scale(1); }
        }
        tbody td { padding: 10px; vertical-align: middle; }
        .item-name { font-weight: 600; color: #333; }
        .item-num { color: #999; font-size: 12px; }
        .upc-badge {
            display: inline-block;
            background: #e8eaf6;
            color: #3949ab;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 3px;
            font-weight: 600;
        }
        .must-have {
            text-align: center;
            font-weight: 700;
            color: #667eea;
        }
        .count-input {
            width: 80px;
            padding: 6px 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            color: #333;
        }
        .count-input:focus { outline: none; border-color: #4caf50; background: #f0fff4; }
        .count-input.has-value { border-color: #4caf50; background: #f0fff4; color: #2e7d32; }
        .notes-input {
            width: 100%;
            padding: 6px 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
        }
        .notes-input:focus { outline: none; border-color: #667eea; }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
            display: inline-block;
            margin-right: 6px;
        }
        .status-dot.done { background: #4caf50; }
        .loading { text-align: center; padding: 40px; color: #999; font-size: 16px; }
        .error-msg {
            background: #fdecea;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 15px; }
            .toolbar, .search-box, .scanner-section { display: none !important; }
            .count-input { border: 1px solid #999; background: white; -webkit-print-color-adjust: exact; }
            .notes-input { border: 1px solid #999; }
            thead tr { background: #667eea !important; -webkit-print-color-adjust: exact; }
            tbody tr:nth-child(even) { background: #f8f9ff !important; -webkit-print-color-adjust: exact; }
            .summary-bar { display: none; }
            table { font-size: 12px; }
            thead th, tbody td { padding: 7px 8px; }
            .meta-field input { border: 1px solid #999; }
            @page { margin: 1cm; }
        }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            table { font-size: 13px; }
            .count-input { width: 65px; }
            thead th:last-child, tbody td:last-child { display: none; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>📋 KC9 Full Inventory Count Sheet</h1>
        <p>Upload today's sales CSV first — then count. Scan barcode or search by name.</p>
    </div>

    <div class="meta-row">
        <div class="meta-field">
            <label>Count Date</label>
            <input type="text" id="countDate">
        </div>
        <div class="meta-field">
            <label>Counted By</label>
            <input type="text" id="countedBy" placeholder="e.g. Harry">
        </div>
        <div class="meta-field">
            <label>Store</label>
            <input type="text" id="storeName" value="KC9" readonly>
        </div>
        <div class="meta-field">
            <label>Time Started</label>
            <input type="text" id="timeStarted">
        </div>
    </div>

    <!-- BARCODE SCANNER -->
    <div class="scanner-section">
        <h3>📷 Barcode Scanner</h3>
        <div class="scanner-row">
            <div class="scanner-input-wrap">
                <span class="scan-icon">🔍</span>
                <input
                    type="text"
                    id="barcodeInput"
                    placeholder="Scan barcode or type UPC here..."
                    autocomplete="off"
                    autocorrect="off"
                    spellcheck="false"
                >
            </div>
        </div>
        <div class="scan-result" id="scanResult"></div>
        <div class="upc-stats">
            <div class="upc-stat">Mapped UPCs: <span id="mappedCount">—</span></div>
            <div class="upc-stat">New UPCs this session: <span id="newUpcCount">0</span></div>
        </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="toolbar">
        <button class="btn-load" onclick="loadItems()">🔄 Load Items</button>
        <button class="btn-print" onclick="window.print()">🖨️ Print Sheet</button>
        <button class="btn-clear" onclick="clearCounts()">🗑️ Clear All Counts</button>
        <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search item name or number..." oninput="filterTable()">
    </div>

    <div class="summary-bar" id="summaryBar" style="display:none;">
        <span class="summary-chip chip-total">📦 Total: <span id="totalCount">0</span></span>
        <span class="summary-chip chip-counted">✅ Counted: <span id="doneCount">0</span></span>
        <span class="summary-chip chip-remaining">⏳ Remaining: <span id="remainCount">0</span></span>
        <span class="summary-chip chip-newupc">🆕 New UPCs: <span id="newUpcSummary">0</span></span>
    </div>

    <div id="tableArea">
        <div class="loading">Click "Load Items" to pull your live item list</div>
    </div>

</div>

<script>
    const DEPLOYED_URL = 'https://script.google.com/macros/s/AKfycbxne0r1e3dn2IlVk7DW0R5nPe6bCVf2FNu-kyx34NOVonDefvaEEzOVAEsHM7tVU4x_Yg/exec';
    let allItems    = [];
    let upcMap      = {};   // { normalizedUPC: itemNumber }
    let itemByNum   = {};   // { itemNumber: item }
    let newUPCs     = [];   // UPCs scanned that aren't in mapping yet
    let newUpcCount = 0;

    // ── NORMALIZE UPC ────────────────────────────────────────────────────
    // Strips leading zeros so 02838423 matches 2838423
    function normalizeUPC(upc) {
        return String(upc || '').trim().replace(/^0+/, '') || '0';
    }

    // ── AUTO-FILL DATE & TIME ─────────────────────────────────────────────
    window.addEventListener('load', () => {
        const now  = new Date();
        const mm   = String(now.getMonth() + 1).padStart(2, '0');
        const dd   = String(now.getDate()).padStart(2, '0');
        const yyyy = now.getFullYear();
        document.getElementById('countDate').value = mm + '/' + dd + '/' + yyyy;

        const h    = now.getHours();
        const mins = String(now.getMinutes()).padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        document.getElementById('timeStarted').value = (h % 12 || 12) + ':' + mins + ' ' + ampm;

        // Keep barcode field focused at all times
        keepScannerFocused();
    });

    function keepScannerFocused() {
        const scanner = document.getElementById('barcodeInput');
        document.addEventListener('click', (e) => {
            // Refocus scanner unless user clicked a count/notes input
            const tag = e.target.tagName;
            const cls = e.target.className || '';
            if (tag !== 'INPUT' || (!cls.includes('count-input') && !cls.includes('notes-input') && !cls.includes('search-box') && !cls.includes('meta-field'))) {
                setTimeout(() => scanner.focus(), 100);
            }
        });
    }

    // ── LOAD ITEMS + UPC MAP ──────────────────────────────────────────────
    function loadItems() {
        document.getElementById('tableArea').innerHTML = '<div class="loading">⏳ Loading items...</div>';
        document.getElementById('summaryBar').style.display = 'none';
        document.getElementById('errorMsg').style.display   = 'none';

        // Load items and UPC mapping in parallel
        Promise.all([
            fetch(DEPLOYED_URL + '?action=getSmartOrderData').then(r => r.json()),
            fetch(DEPLOYED_URL + '?action=getUPCMapping').then(r => r.json())
        ])
        .then(([items, upcRaw]) => {
            if (!Array.isArray(items) || items.length === 0) {
                showError('No items returned. Check your connection.');
                return;
            }

            // Build UPC map — normalize to handle short barcodes
            upcMap    = {};
            itemByNum = {};
            let mappedTotal = 0;

            if (Array.isArray(upcRaw)) {
                for (let i = 1; i < upcRaw.length; i++) {
                    const rawUPC  = String(upcRaw[i][0] || '').trim();
                    const itemNum = String(upcRaw[i][1] || '').trim();
                    if (rawUPC && itemNum && !itemNum.startsWith('PENDING_')) {
                        upcMap[normalizeUPC(rawUPC)] = itemNum;
                        mappedTotal++;
                    }
                }
            }
            document.getElementById('mappedCount').textContent = mappedTotal;

            // Sort A-Z
            allItems = items.sort((a, b) => (a.itemName || '').localeCompare(b.itemName || ''));
            allItems.forEach(item => {
                itemByNum[String(item.itemNumber || '').trim()] = item;
            });

            renderTable(allItems);
            document.getElementById('summaryBar').style.display = 'flex';
            updateSummary();
            document.getElementById('barcodeInput').focus();
        })
        .catch(err => showError('Error loading: ' + err));
    }

    // ── BARCODE SCAN HANDLER ──────────────────────────────────────────────
    document.getElementById('barcodeInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const raw        = this.value.trim();
            const normalized = normalizeUPC(raw);
            this.value = '';

            if (!raw) return;

            const resultEl = document.getElementById('scanResult');

            // Look up in UPC map
            const itemNum = upcMap[normalized];

            if (itemNum) {
                // Found in UPC mapping
                const item = itemByNum[itemNum];
                if (item) {
                    highlightRow(itemNum);
                    resultEl.className = 'scan-result found';
                    resultEl.textContent = '✅ Found: ' + item.itemName + '  (#' + itemNum + ')  →  Enter count below';
                } else {
                    resultEl.className = 'scan-result not-found';
                    resultEl.textContent = '⚠️ UPC mapped to item ' + itemNum + ' but item not in list';
                }
            } else {
                // Not in UPC mapping — new UPC
                newUpcCount++;
                newUPCs.push({ upc: raw, normalized: normalized, scannedAt: new Date().toISOString() });
                document.getElementById('newUpcCount').textContent  = newUpcCount;
                document.getElementById('newUpcSummary').textContent = newUpcCount;

                resultEl.className = 'scan-result new-upc';
                resultEl.innerHTML = '🆕 New UPC: <strong>' + raw + '</strong> — not in UPC Mapping yet.<br>' +
                    '<small>Note the item name manually and add to UPC Mapping sheet later.</small>';
            }

            // Clear result after 4 seconds
            setTimeout(() => { resultEl.className = 'scan-result'; }, 4000);
        }
    });

    // ── HIGHLIGHT ROW & SCROLL TO IT ──────────────────────────────────────
    function highlightRow(itemNum) {
        // Remove previous highlight
        document.querySelectorAll('tbody tr.highlighted').forEach(r => r.classList.remove('highlighted'));

        const row      = document.getElementById('row_' + itemNum);
        const countInput = document.getElementById('cnt_' + itemNum);

        if (row) {
            // Make sure row is visible (in case filtered)
            row.style.display = '';

            row.classList.add('highlighted');
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Focus the count input for that item
            if (countInput) {
                setTimeout(() => {
                    countInput.focus();
                    countInput.select();
                }, 300);
            }

            // Remove highlight after 3 seconds
            setTimeout(() => row.classList.remove('highlighted'), 3000);
        }
    }

    // ── RENDER TABLE ──────────────────────────────────────────────────────
    function renderTable(items) {
        if (!items || items.length === 0) {
            document.getElementById('tableArea').innerHTML = '<div class="loading">No items found.</div>';
            return;
        }

        let html = `
            <table id="countTable">
                <thead>
                    <tr>
                        <th width="30">#</th>
                        <th>Item Name</th>
                        <th width="90">Item #</th>
                        <th width="80" style="text-align:center;">Must Have</th>
                        <th width="100" style="text-align:center;">Your Count</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody>
        `;

        items.forEach((item, index) => {
            const itemNum  = String(item.itemNumber || '').trim();
            const itemName = item.itemName || '';
            const mustHave = (item.mustHave || 0).toFixed(1);

            // Find UPCs for this item to display
            const itemUPCs = Object.entries(upcMap)
                .filter(([upc, num]) => num === itemNum)
                .map(([upc]) => upc)
                .slice(0, 2); // show max 2

            const upcBadges = itemUPCs.map(u => `<span class="upc-badge">${u}</span>`).join(' ');

            html += `
                <tr id="row_${itemNum}" data-name="${itemName.toLowerCase()}" data-num="${itemNum}">
                    <td style="color:#bbb;font-size:12px;">${index + 1}</td>
                    <td>
                        <div class="item-name">
                            <span class="status-dot" id="dot_${itemNum}"></span>${itemName}
                        </div>
                        ${upcBadges ? '<div style="margin-top:3px;">' + upcBadges + '</div>' : ''}
                    </td>
                    <td><span class="item-num">${itemNum}</span></td>
                    <td class="must-have">${mustHave}</td>
                    <td style="text-align:center;">
                        <input
                            type="number"
                            class="count-input"
                            id="cnt_${itemNum}"
                            placeholder="0.0"
                            step="0.1"
                            min="0"
                            onchange="onCountEntered('${itemNum}')"
                            oninput="onCountEntered('${itemNum}')"
                        >
                    </td>
                    <td>
                        <input type="text" class="notes-input" id="note_${itemNum}" placeholder="damaged, low, missing...">
                    </td>
                </tr>
            `;
        });

        html += '</tbody></table>';
        document.getElementById('tableArea').innerHTML = html;
    }

    // ── COUNT INPUT HANDLER ───────────────────────────────────────────────
    function onCountEntered(itemNum) {
        const input = document.getElementById('cnt_' + itemNum);
        const dot   = document.getElementById('dot_' + itemNum);
        const row   = document.getElementById('row_' + itemNum);
        const val   = input.value.trim();

        if (val !== '' && !isNaN(parseFloat(val))) {
            input.classList.add('has-value');
            dot.classList.add('done');
            row.classList.add('counted');
        } else {
            input.classList.remove('has-value');
            dot.classList.remove('done');
            row.classList.remove('counted');
        }
        updateSummary();

        // After entering count — return focus to scanner
        // Small delay so user can tab to notes if needed
        setTimeout(() => {
            const scanner = document.getElementById('barcodeInput');
            if (document.activeElement !== document.getElementById('note_' + itemNum)) {
                scanner.focus();
            }
        }, 500);
    }

    // ── SUMMARY BAR ───────────────────────────────────────────────────────
    function updateSummary() {
        const total   = allItems.length;
        const counted = document.querySelectorAll('.count-input.has-value').length;
        document.getElementById('totalCount').textContent    = total;
        document.getElementById('doneCount').textContent     = counted;
        document.getElementById('remainCount').textContent   = total - counted;
        document.getElementById('newUpcSummary').textContent = newUpcCount;
    }

    // ── FILTER TABLE ──────────────────────────────────────────────────────
    function filterTable() {
        const search = document.getElementById('searchBox').value.toLowerCase().trim();
        document.querySelectorAll('#countTable tbody tr').forEach(row => {
            const name = row.getAttribute('data-name') || '';
            const num  = row.getAttribute('data-num') || '';
            row.style.display = (name.includes(search) || num.includes(search)) ? '' : 'none';
        });
    }

    // ── CLEAR ALL ─────────────────────────────────────────────────────────
    function clearCounts() {
        if (!confirm('Clear all counts entered so far?')) return;
        document.querySelectorAll('.count-input').forEach(i => { i.value = ''; i.classList.remove('has-value'); });
        document.querySelectorAll('.notes-input').forEach(i => i.value = '');
        document.querySelectorAll('.status-dot').forEach(d => d.classList.remove('done'));
        document.querySelectorAll('tbody tr').forEach(r => r.classList.remove('counted'));
        newUpcCount = 0;
        newUPCs     = [];
        document.getElementById('newUpcCount').textContent   = 0;
        document.getElementById('newUpcSummary').textContent = 0;
        updateSummary();
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent    = msg;
        el.style.display  = 'block';
        document.getElementById('tableArea').innerHTML = '';
    }
</script>
</body>
</html>
