<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC9 Inventory Counter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .login-section {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .login-section.active {
            display: block;
        }
        
        .login-section input {
            padding: 12px 20px;
            margin: 10px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            width: 100%;
            max-width: 300px;
        }
        
        .login-section button {
            background: #667eea;
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .login-section button:hover {
            background: #764ba2;
        }
        
        .counter-section {
            display: none;
        }
        
        .counter-section.active {
            display: block;
        }
        
        .info-bar {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .info-bar p {
            margin: 5px 0;
            font-weight: 500;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .controls input,
        .controls select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .controls button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .controls button:hover {
            background: #764ba2;
        }
        
        .controls button.logout {
            background: #e74c3c;
            margin-left: auto;
        }
        
        .controls button.logout:hover {
            background: #c0392b;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f9f9f9;
        }
        
        input[type="number"] {
            width: 80px;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .button-group button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .button-group .save-btn {
            background: #27ae60;
            color: white;
        }
        
        .button-group .save-btn:hover {
            background: #229954;
        }
        
        .button-group .clear-btn {
            background: #e74c3c;
            color: white;
        }
        
        .button-group .clear-btn:hover {
            background: #c0392b;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 KC9 Inventory Counter</h1>
            <p>Real-time cigarette inventory tracking</p>
        </div>
        
        <div class="content">
            <!-- LOGIN SECTION -->
            <div class="login-section active">
                <h2 style="margin-bottom: 30px;">Login</h2>
                <input type="password" id="passwordInput" placeholder="Enter password" />
                <button onclick="login()">Login</button>
                <div class="status"></div>
            </div>
            
            <!-- COUNTER SECTION -->
            <div class="counter-section">
                <div class="info-bar">
                    <p><strong>Employee:</strong> <span id="employeeNameDisplay"></span></p>
                    <p><strong>Date:</strong> <span id="dateDisplay"></span></p>
                    <p><strong>Items:</strong> <span id="itemCountDisplay">0</span></p>
                </div>
                
                <div class="controls">
                    <label>Date:</label>
                    <input type="date" id="dateInput" />
                    <button onclick="loadItems()">Load Items</button>
                    <button class="logout" onclick="logout()">Logout</button>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Item #</th>
                            <th>Must Have</th>
                            <th>Display</th>
                            <th>Back Stock</th>
                            <th>Total Stock</th>
                            <th>Order Qty</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTable">
                    </tbody>
                </table>
                
                <div class="button-group">
                    <button class="save-btn" onclick="saveToSheets()">💾 Save to Sheets</button>
                    <button class="clear-btn" onclick="clearTable()">🗑️ Clear All</button>
                </div>
                
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Saving data...</p>
                </div>
                
                <div class="status"></div>
            </div>
        </div>
    </div>

    <script>
        const MANAGER_PASSWORD = '977381';
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxP5W9BDfiXLvNAq5Uk99G4a0qe7WQ9UD2-Iz-ir-3sgOVVG_B155vCxwr-DpqGWhMzUA/exec';
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2F0AirAwq5MJ5WKj1dL9TTUtm-OByP6XjCLtUNjTvziy7ih-22VwKuZId_Vx6TpOHEBIPek9e0y2XKv4HZk/pub?gid=0&single=true&output=csv';
        
        let employeeName = '';
        let items = [];
        
        function login() {
            const password = document.getElementById('passwordInput').value;
            const employeeInput = document.getElementById('passwordInput');
            
            if (password === MANAGER_PASSWORD) {
                // Password is correct, ask for employee name
                const name = prompt('Enter your name:');
                if (name) {
                    employeeName = name.trim();
                    document.querySelector('.login-section').classList.remove('active');
                    document.querySelector('.counter-section').classList.add('active');
                    document.getElementById('employeeNameDisplay').textContent = employeeName;
                    
                    // Set today's date
                    const today = new Date().toISOString().split('T')[0];
                    document.getElementById('dateInput').value = today;
                    document.getElementById('dateDisplay').textContent = today;
                    
                    loadItems();
                } else {
                    showStatus('Please enter your name', 'error');
                }
            } else {
                showStatus('❌ Incorrect password', 'error');
            }
        }
        
        function logout() {
            employeeName = '';
            items = [];
            document.querySelector('.login-section').classList.add('active');
            document.querySelector('.counter-section').classList.remove('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('itemsTable').innerHTML = '';
            showStatus('', '');
        }
        
        async function loadItems() {
            const date = document.getElementById('dateInput').value;
            if (!date) {
                showStatus('❌ Please select a date', 'error');
                return;
            }
            
            document.getElementById('dateDisplay').textContent = date;
            
            try {
                const response = await fetch(SCRIPT_URL + '?action=getItems');
                const data = await response.json();
                
                if (data.success) {
                    items = data.items;
                    renderTable();
                    document.getElementById('itemCountDisplay').textContent = items.length;
                    showStatus('✅ Items loaded', 'success');
                } else {
                    showStatus('❌ Failed to load items', 'error');
                }
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        }
        
        function renderTable() {
            const tableBody = document.getElementById('itemsTable');
            tableBody.innerHTML = '';
            
            items.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.name}</td>
                    <td>${item.number}</td>
                    <td>${item.mustHave}</td>
                    <td><input type="number" id="loc1_${index}" value="0" min="0" step="0.1" onchange="updateTotalStock(${index})"></td>
                    <td><input type="number" id="loc2_${index}" value="0" min="0" step="0.1" onchange="updateTotalStock(${index})"></td>
                    <td><span id="total_${index}">0</span></td>
                    <td><input type="number" id="order_${index}" value="0" min="0" step="0.1"></td>
                `;
                tableBody.appendChild(row);
            });
        }
        
        function updateTotalStock(index) {
            const loc1 = parseFloat(document.getElementById(`loc1_${index}`).value) || 0;
            const loc2 = parseFloat(document.getElementById(`loc2_${index}`).value) || 0;
            const total = loc1 + loc2;
            
            const mustHave = parseFloat(items[index].mustHave) || 0;
            const orderQty = Math.max(0, mustHave - total);
            
            document.getElementById(`total_${index}`).textContent = total.toFixed(1);
            document.getElementById(`order_${index}`).value = orderQty.toFixed(1);
        }
        
        async function saveToSheets() {
            const date = document.getElementById('dateInput').value;
            
            if (!date) {
                showStatus('❌ Please select a date', 'error');
                return;
            }
            
            // CONVERT DATE FROM "2026-09-07" TO "20260907" FORMAT
            const dateKey = date.replace(/-/g, '');
            
            const itemsData = [];
            items.forEach((item, index) => {
                const loc1 = parseFloat(document.getElementById(`loc1_${index}`).value) || 0;
                const loc2 = parseFloat(document.getElementById(`loc2_${index}`).value) || 0;
                const total = loc1 + loc2;
                const orderQty = parseFloat(document.getElementById(`order_${index}`).value) || 0;
                
                itemsData.push({
                    date: dateKey,  // Send as "20260907" instead of "2026-09-07"
                    countedBy: employeeName,
                    itemName: item.name,
                    itemNumber: item.number,
                    mustHave: parseFloat(item.mustHave) || 0,
                    location1: loc1,
                    location2: loc2,
                    totalStock: total,
                    orderQty: orderQty,
                    timestamp: new Date().toLocaleString()
                });
            });
            
            if (itemsData.length === 0) {
                showStatus('❌ No items to save', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'saveInventoryCount',
                        data: itemsData
                    })
                });
                
                const result = await response.json();
                showLoading(false);
                
                if (result.success) {
                    showStatus('✅ ' + result.message, 'success');
                    clearTable();
                } else {
                    showStatus('❌ Error: ' + result.message, 'error');
                }
            } catch (error) {
                showLoading(false);
                showStatus('❌ Error: ' + error.message, 'error');
            }
        }
        
        function clearTable() {
            items.forEach((item, index) => {
                document.getElementById(`loc1_${index}`).value = '0';
                document.getElementById(`loc2_${index}`).value = '0';
                document.getElementById(`order_${index}`).value = '0';
                document.getElementById(`total_${index}`).textContent = '0';
            });
        }
        
        function showStatus(message, type) {
            const statusDiv = document.querySelector('.counter-section .status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
            
            const loginStatus = document.querySelector('.login-section .status');
            loginStatus.textContent = message;
            loginStatus.className = 'status ' + type;
        }
        
        function showLoading(show) {
            const loading = document.querySelector('.loading');
            if (show) {
                loading.classList.add('show');
            } else {
                loading.classList.remove('show');
            }
        }
        
        // Set default date to today
        window.addEventListener('load', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateInput').value = today;
        });
    </script>
</body>
</html>
